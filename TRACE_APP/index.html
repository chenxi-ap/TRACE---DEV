function getLayout(eleCount, cy) {
  if (STATE.layoutName === 'timeline' && cy) {
    return getTimelineLayout(getFilteredTransactions(), cy);
  }
  if (STATE.layoutName === 'radial' && STATE.layoutRootEntity && cy) {
    return getRadialFromEntity(STATE.layoutRootEntity, cy);
  }
  if (STATE.layoutName === 'hierarchy_from' && STATE.layoutRootEntity && cy) {
    return getHierarchyFromEntity(STATE.layoutRootEntity, cy);
  }
  const def = LAYOUT_DEFS[STATE.layoutName];
  if (def) return def.get(eleCount);
  return LAYOUT_DEFS.fcose.get(eleCount);
}

function renderCy(container, elements, mode) {
  let layoutCfg;
  if (STATE.layoutName === 'radial' || STATE.layoutName === 'hierarchy_from' || STATE.layoutName === 'timeline') {
    layoutCfg = { name: 'preset' };
  } else {
    layoutCfg = getLayout(elements.nodes.length + elements.edges.length, null);
  }

  let cy;
  try {
    cy = cytoscape({
      container: document.getElementById(container),
      elements: [...elements.nodes, ...elements.edges],
      style: getCyStyle(),
      layout: layoutCfg,
      minZoom: 0.1, maxZoom: 5, wheelSensitivity: 0.3,
      boxSelectionEnabled: true, selectionType: 'additive',
    });
  } catch (err) {
    console.warn('Layout "' + layoutCfg.name + '" failed, falling back to cose:', err);
    cy = cytoscape({
      container: document.getElementById(container),
      elements: [...elements.nodes, ...elements.edges],
      style: getCyStyle(),
      layout: LAYOUT_DEFS.cose.get(elements.nodes.length + elements.edges.length),
      minZoom: 0.1, maxZoom: 5, wheelSensitivity: 0.3,
      boxSelectionEnabled: true, selectionType: 'additive',
    });
  }

  // Tooltip
  const tooltip = $('#tooltip');
  cy.on('mouseover', 'node', e => {
    const d = e.target.data();
    tooltip.innerHTML = `<div class="tt-title">${escHtml(d.label)}</div>
      <div class="tt-row">Transactions: ${d.txnCount}</div>
      <div class="tt-row">Total In: ${formatAmount(d.totalIn)}</div>
      <div class="tt-row">Total Out: ${formatAmount(d.totalOut)}</div>`;
    tooltip.style.display = 'block';
  });
  cy.on('mouseover', 'edge', e => {
    const d = e.target.data();
    tooltip.innerHTML = `<div class="tt-title">${escHtml(resolveDisplayName(d.source))} &rarr; ${escHtml(resolveDisplayName(d.target))}</div>
      <div class="tt-row">Amount: ${d.label}</div>
      ${d.date ? `<div class="tt-row">Date: ${d.date}</div>` : ''}
      ${d.desc ? `<div class="tt-row">${escHtml(d.desc)}</div>` : ''}`;
    tooltip.style.display = 'block';
  });
  cy.on('mousemove', e => {
    tooltip.style.left = (e.originalEvent.clientX + 12) + 'px';
    tooltip.style.top = (e.originalEvent.clientY + 12) + 'px';
  });
  cy.on('mouseout', () => { tooltip.style.display = 'none'; });

// Click node: Shift+Click = toggle orange outline for grouping; normal click = highlight
  cy.on('tap', 'node', e => {
    const node = e.target;
    if (e.originalEvent && e.originalEvent.shiftKey) {
      // Toggle orange "pending group" outline
      if (STATE.shiftSelected.has(node.id())) {
        STATE.shiftSelected.delete(node.id());
        node.removeClass('shift-selected');
      } else {
        STATE.shiftSelected.add(node.id());
        node.addClass('shift-selected');
      }
      // Don't change dimming — just the outline
    } else {
      // Normal click: clear all shift selections and do standard highlight
      STATE.shiftSelected.forEach(id => cy.getElementById(id).removeClass('shift-selected'));
      STATE.shiftSelected.clear();
      cy.elements().removeClass('highlighted dimmed');
      cy.elements().addClass('dimmed');
      node.removeClass('dimmed').addClass('highlighted');
      node.connectedEdges().removeClass('dimmed').addClass('highlighted');
      node.neighborhood('node').removeClass('dimmed').addClass('highlighted');
      STATE.selectedElements = new Set([node.id()]);
    }
  });

  // Click edge -> show detail panel
  cy.on('tap', 'edge', e => {
    showEdgeDetail(e.target.data(), mode);
  });

// Click background -> clear
  cy.on('tap', e => {
    if (e.target === cy) {
      cy.elements().removeClass('highlighted dimmed anomaly-highlight path-highlight shift-selected');
      STATE.selectedElements.clear();
      STATE.shiftSelected.clear();
      hideDetailPanel();
    }
  });

  // Right-click context menu
  cy.on('cxttap', 'node', e => { e.originalEvent.preventDefault(); showContextMenu(e.originalEvent, e.target, 'node', cy); });
  cy.on('cxttap', 'edge', e => { e.originalEvent.preventDefault(); showContextMenu(e.originalEvent, e.target, 'edge', cy); });
  cy.on('cxttap', e => {
    if (e.target === cy) hideContextMenu();
  });

  // Selection tracking
  cy.on('select', 'node, edge', () => {
    STATE.selectedElements = new Set(cy.$(':selected').map(ele => ele.id()));
  });

  // Restore saved positions if available
let positionsRestored = false;
if (STATE._savedPositions && Object.keys(STATE._savedPositions).length > 0) {
  cy.nodes().forEach(n => {
    const pos = STATE._savedPositions[n.id()];
    if (pos) n.position(pos);
  });
  cy.fit();
  positionsRestored = true;
  STATE._savedPositions = null;
}

// For entity-centric layouts, run layout only if we didn't restore positions
if (!positionsRestored && (STATE.layoutName === 'radial' || STATE.layoutName === 'hierarchy_from' || STATE.layoutName === 'timeline')) {
    try {
      const layoutOpts = getLayout(cy.elements().length, cy);
      cy.layout(layoutOpts).run();
    } catch (err) {
      console.warn('Entity-centric layout failed, falling back to cose:', err);
      cy.layout(LAYOUT_DEFS.cose.get(cy.elements().length)).run();
    }
  }

document.getElementById(container).style.background = STATE.bgColor;

return cy;
}

function renderGraphs() {
  const txns = getFilteredTransactions();
  const detailWrap = $('#cy-detail-wrap');
  const summaryWrap = $('#cy-summary-wrap');
  const divider = $('#graph-divider');

  // Save positions — but skip when layout intentionally changed
  if (STATE._skipPositionRestore) {
    STATE._persistentPositions = {};
    STATE._savedPositions = null;
    STATE._skipPositionRestore = false;
  } else {
    if (STATE.cyDetail) {
      STATE.cyDetail.nodes().forEach(n => { STATE._persistentPositions[n.id()] = {...n.position()}; });
    }
    if (STATE.cySummary) {
      STATE.cySummary.nodes().forEach(n => { STATE._persistentPositions[n.id()] = {...n.position()}; });
    }
    STATE._savedPositions = STATE._persistentPositions;
  }
  if (STATE.cyDetail) { STATE.cyDetail.destroy(); STATE.cyDetail = null; }
  if (STATE.cySummary) { STATE.cySummary.destroy(); STATE.cySummary = null; }

    if (STATE.viewMode === 'detail' || STATE.viewMode === 'timeline') {
    detailWrap.style.display = '';
    summaryWrap.style.display = 'none';
    divider.style.display = 'none';
    $('#close-detail').style.display = STATE.viewMode === 'timeline' ? 'none' : '';
    $('#close-summary').style.display = 'none';
    const elems = buildGraphElements(txns, 'detail');
    STATE.cyDetail = renderCy('cy-detail', elems, 'detail');
  } else if (STATE.viewMode === 'summary') {
    detailWrap.style.display = 'none';
    summaryWrap.style.display = '';
    divider.style.display = 'none';
    $('#close-detail').style.display = 'none';
    $('#close-summary').style.display = '';
    const elems = buildGraphElements(txns, 'summary');
    STATE.cySummary = renderCy('cy-summary', elems, 'summary');
  } else {
    // Side by side
    detailWrap.style.display = '';
    summaryWrap.style.display = '';
    divider.style.display = '';
    $('#close-detail').style.display = '';
    $('#close-summary').style.display = '';
    const detailElems = buildGraphElements(txns, 'detail');
    const summaryElems = buildGraphElements(txns, 'summary');
    STATE.cyDetail = renderCy('cy-detail', detailElems, 'detail');
    STATE.cySummary = renderCy('cy-summary', summaryElems, 'summary');
  }

  // Timeline
    runAnomalyDetection(txns);
  buildRightSidebar();
  renderAllAnnotations();
  if (STATE.showTimeline) renderTimeline(txns);
}

function updateGraphStyles() {                                                                                                                                    
    const cys = [STATE.cyDetail, STATE.cySummary].filter(Boolean);                                                                                                  
                                                                                                                                                                    
    cys.forEach(cy => {                                                                                                                                             
      if (STATE.nodeSize !== 'scaled') {                                                                                                                            
        const newSize = typeof STATE.nodeSize === 'number' ? STATE.nodeSize : 45;                                                                                   
        cy.nodes().forEach(node => {                                                                                                                                
          node.data('size', newSize);                                                                                                                               
        });                                                                                                                                                         
      } else {                                                                                                                                                      
        const vols = Array.from(STATE.entities.values()).map(e => e.totalIn + e.totalOut);                                                                                
  const minVol = Math.min(...vols);                                                                                                                                 
  const maxVol = Math.max(...vols);                                                                                                                                 
  const logMin = Math.log1p(minVol);                                                                                                                                
  const logMax = Math.log1p(maxVol);                                                                                                                                
  cy.nodes().forEach(node => {                                                                                                                                      
    const eData = STATE.entities.get(node.id()) || {txnCount: 1, totalIn: 0, totalOut: 0};                                                                          
    const vol = eData.totalIn + eData.totalOut;                                                                                                                     
    const t = logMax > logMin ? (Math.log1p(vol) - logMin) / (logMax - logMin) : 0.5;                                                                               
    node.data('size', 25 + t * 55);                                                                                                                                 
  });                                                                                                                                                         
      }                                                                                                                                                             
                                                                                                                                                                    
      // Update per-entity shapes                                                                                                                                   
      cy.nodes().forEach(node => {                                                                                                                                  
        node.data('shape', STATE.nodeShapes[node.id()] || STATE.nodeShape);                                                                                         
      });                                                                                                                                                           
                                                                                                                                                                    
      const arrowScale = typeof STATE.arrowSize === 'number' ? STATE.arrowSize : 2;                                                                                 
                                                        
      cy.edges().forEach(edge => {                                                                                                                                      
    edge.data('arrowScale', arrowScale);                                                                                                                            
                                                                                                                                                                    
    let color = STATE.edgeColor;                                                                                                                                    
    if (STATE.useDirectionColors && STATE.mainEntity) {                                                                                                             
      const src = edge.data('source');                                                                                                                              
      const tgt = edge.data('target');                                                                                                                              
      if (tgt === STATE.mainEntity) color = STATE.inColor;                                                                                                          
      else if (src === STATE.mainEntity) color = STATE.outColor;                                                                                                    
    }                                                                                                                                                               
    edge.data('color', color);                                                                                                                                      
                                                                                                                                                                    
    if (STATE.edgeThicknessScale) {                                                                                                                                 
      const amt = edge.data('amount');                                                                                                                              
      if (amt != null) {                                                                                                                                            
        const maxAmt = Math.max(...cy.edges().map(e => Math.abs(e.data('amount') || 0)), 1);                                                                        
        const thickness = 1 + (Math.abs(amt) / maxAmt) * 8;                                                                                                         
        edge.data('thickness', thickness);                                                                                                                          
      }                                                                                                                                                             
    } else {                                                                                                                                                        
      edge.data('thickness', STATE.uniformEdgeWidth);                                                                                                               
    }                                                                                                                                                               
  });                                                                                                                                                           
                                                                                                                                                                    
      cy.style(getCyStyle());                                                                                                                                       
    });                                                                                                                                                             
  }
 

function updateViewMode() {
  const panel = $('#timeline-panel');
  const graphArea = $('#graph-area');
  const hints = $('#graph-hints');

  if (STATE.viewMode === 'timeline') {
    STATE.showTimeline = true;
    panel.style.flexBasis = (STATE.timelineHeight || 360) + 'px';
    panel.classList.add('active');
    graphArea.style.display = '';
        if (hints) hints.style.display = '';
    renderGraphs();
  } else {
    STATE.showTimeline = false;
    if (STATE._tlPlayInterval) { clearInterval(STATE._tlPlayInterval); STATE._tlPlayInterval = null; }
    STATE._tlRefresh = null;
    panel.classList.remove('active');
    $('#timeline-container').innerHTML = '';
    graphArea.style.display = '';
    if (hints) hints.style.display = '';
    renderGraphs();
  }
}

function getActiveCy() {
  if (STATE.viewMode === 'summary') return STATE.cySummary;
  return STATE.cyDetail || STATE.cySummary;
}


function openRenameModal(entityId) {
  const modal = $('#rename-modal');
  const input = $('#rn-input');
  const restoreBtn = $('#rn-restore');
  const hasOverride = !!STATE.nodeLabels[entityId];

  $('#rn-original').textContent = entityId;
  input.value = STATE.nodeLabels[entityId] || entityId;
  restoreBtn.style.display = hasOverride ? '' : 'none';

  function close() { modal.classList.remove('active'); }

  function save() {
    const trimmed = input.value.trim();
    if (!trimmed || trimmed === entityId) delete STATE.nodeLabels[entityId];
    else STATE.nodeLabels[entityId] = trimmed;
    close();
    renderGraphs();
  }

  $('#rn-save').onclick = save;
  $('#rn-cancel').onclick = close;
  restoreBtn.onclick = () => { delete STATE.nodeLabels[entityId]; close(); renderGraphs(); };
  modal.onclick = e => { if (e.target === modal) close(); };
  input.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') save();
    else if (e.key === 'Escape') close();
  };

  modal.classList.add('active');
  setTimeout(() => { input.focus(); input.select(); }, 30);
}

function resolveDisplayName(id) {
  if (!id.startsWith('__group__')) return displayName(id);
  const groupId = id.replace('__group__', '');
  const g = STATE.groups.get(groupId);
  return g ? g.name : id;

    menu.style.left = event.clientX + 'px';

if (type === 'node') {

/* ---- timeline axis helpers ---- */
function tlFormatTick(d, unit, spanDays) {
  switch (unit) {
    case 'year':    return String(d.getFullYear());
    case 'quarter': return `Q${Math.floor(d.getMonth()/3)+1} ${d.getFullYear()}`;
    case 'month':   return d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
    default:        return spanDays > 330
      ? d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'2-digit'})
      : d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }
}

function tlGenerateTicks(minTs, maxTs, mode, timeW) {
  const range = maxTs - minTs || 86400000;
  const spanDays = range / 86400000;
  let unit = mode;
  if (mode === 'auto') {
    if (spanDays <= 21) unit = 'day';
    else if (spanDays <= 120) unit = 'week';
    else if (spanDays <= 800) unit = 'month';
    else if (spanDays <= 2400) unit = 'quarter';
    else unit = 'year';
  }
  const s = new Date(minTs);
  let cur;
  if (unit === 'day') cur = new Date(s.getFullYear(), s.getMonth(), s.getDate());
  else if (unit === 'week') { cur = new Date(s.getFullYear(), s.getMonth(), s.getDate()); cur.setDate(cur.getDate() - cur.getDay()); }
  else if (unit === 'month') cur = new Date(s.getFullYear(), s.getMonth(), 1);
  else if (unit === 'quarter') cur = new Date(s.getFullYear(), Math.floor(s.getMonth()/3)*3, 1);
  else cur = new Date(s.getFullYear(), 0, 1);

  const ticks = [];
  let guard = 0;
  while (cur.getTime() <= maxTs && guard++ < 3000) {
    if (cur.getTime() >= minTs) ticks.push({ ts: cur.getTime(), label: tlFormatTick(cur, unit, spanDays) });
    if (unit === 'day') cur.setDate(cur.getDate() + 1);
    else if (unit === 'week') cur.setDate(cur.getDate() + 7);
    else if (unit === 'month') cur.setMonth(cur.getMonth() + 1);
    else if (unit === 'quarter') cur.setMonth(cur.getMonth() + 3);
    else cur.setFullYear(cur.getFullYear() + 1);
  }
  if (!ticks.length) ticks.push({ ts: minTs, label: tlFormatTick(new Date(minTs), unit, spanDays) });

  const f = STATE.timelineAxisFont;
  const minPx = Math.max(46, (f.size || 9) * 7);
  const maxTicks = Math.max(2, Math.floor(timeW / minPx));
  if (ticks.length > maxTicks) {
    const stride = Math.ceil(ticks.length / maxTicks);
    return ticks.filter((_, i) => i % stride === 0);
  }
  return ticks;
}

/* Stable color per originating entity. Computed from ALL transactions (not the
   filtered set) so colors don't reshuffle when filters change. Honors any
   per-entity color the user set on the detail chart. */
const TL_SOURCE_PALETTE = [
  '#3fb950','#58a6ff','#d29922','#bc8cff','#f778ba',
  '#2ea043','#79c0ff','#e3b341','#a371f7','#ff7b72'
];
function tlSourceColorMap() {
  const outCount = new Map();
  STATE.transactions.forEach(t => outCount.set(t.from, (outCount.get(t.from) || 0) + 1));
  const ranked = Array.from(outCount.entries()).sort((a, b) =>
    b[1] - a[1] || a[0].localeCompare(b[0])
  );
    const map = new Map();
  ranked.forEach(([ent], i) => {
    if (STATE.timelineSourceColors[ent]) map.set(ent, STATE.timelineSourceColors[ent]);
    else if (STATE.nodeColors[ent]) map.set(ent, STATE.nodeColors[ent]);
    else if (i < TL_SOURCE_PALETTE.length) map.set(ent, TL_SOURCE_PALETTE[i]);
    else map.set(ent, '#6e7681');
  });
  return map;
}

/* Resolve one transaction to the graph elements that represent it */
function tlElementsFor(cy, t) {
  let coll = cy.collection();
  const direct = cy.getElementById(`e${t.id}`);
  if (direct.length) return coll.union(direct).union(direct.source()).union(direct.target());
  let se = cy.getElementById(`s_${t.from}->${t.to}`);
  if (!se.length) se = cy.getElementById(`merged_${resolveEntityToGroupNode(t.from)}|||${resolveEntityToGroupNode(t.to)}`);
  if (se.length) return coll.union(se).union(se.source()).union(se.target());
  [t.from, t.to].forEach(id => {
    const n = cy.getElementById(resolveEntityToGroupNode(id));
    if (n.length) coll = coll.union(n);
  });
  return coll;
}

function bindTimelineResizer() {
  const rz = $('#timeline-resizer'), panel = $('#timeline-panel');
  if (!rz || !panel) return;
  let dragging = false, startY = 0, startH = 0;
  rz.addEventListener('mousedown', e => {
    dragging = true; startY = e.clientY;
    startH = panel.getBoundingClientRect().height;
    document.body.style.userSelect = 'none'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const h = Math.max(140, Math.min(window.innerHeight - 220, startH + (e.clientY - startY)));
    STATE.timelineHeight = h;
    panel.style.flexBasis = h + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; document.body.style.userSelect = '';
    const cy = getActiveCy(); if (cy) cy.resize();
    if (STATE.showTimeline) renderTimeline(getFilteredTransactions());
  });
}

function renderTimeline(txns) {

    return;

  dated.sort((a, b) => a.date - b.date);
  const minDate = dated[0].date.getTime();

  // ---- entity order (persists user drag-reorder) ----
  const entitySet = new Set();
  dated.forEach(t => { entitySet.add(t.from); entitySet.add(t.to); });
  if (!STATE._timelineEntityOrder) STATE._timelineEntityOrder = [];
  STATE._timelineEntityOrder = STATE._timelineEntityOrder.filter(e => entitySet.has(e));
  Array.from(entitySet).sort().forEach(e => {
    if (!STATE._timelineEntityOrder.includes(e)) STATE._timelineEntityOrder.push(e);
  });
  const entities = STATE._timelineEntityOrder;
  let entityIdx = new Map(entities.map((e, i) => [e, i]));

  const byDate = new Map();
  dated.forEach(t => {
    const dk = t.date.toISOString().slice(0, 10);

    byDate.get(dk).push(t);

  const dateKeys = Array.from(byDate.keys()).sort();

  // ---- geometry ----

    const amt = Math.abs(amount || 0);

  $('#tl-ax-mode', pop).value = STATE.timelineAxisMode;

  $('#tl-ax-bold', pop).checked = !!f.bold;

  function readAxis() {
    STATE.timelineAxisMode = $('#tl-ax-mode', pop).value;

  function readSizes() {
    STATE.timelineDotScale  = parseFloat($('#tl-dot-scale', pop).value);

  $$('#tl-ax-mode, #tl-ax-family, #tl-ax-size, #tl-ax-color, #tl-ax-bold, #tl-ax-italic', pop)

  // --- playback ---
  let playInterval = null, playIndex = 0;

  const playBtn = el('button', {textContent: '▶ Play'});
  const speedSel = el('select');
  [['Slow',1200],['Normal',600],['Fast',250]].forEach(([label, ms]) => speedSel.appendChild(el('option', {value: String(ms), textContent: label})));

  const replayBtn = el('button', {textContent: '↺ Replay', style: 'display:none'});
  const stepLabel = el('span', {className: 'tl-step'});
    ctrlBar.appendChild(playBtn); ctrlBar.appendChild(speedSel);

  const legend = el('span', {style:'display:flex;align-items:center;gap:10px;margin-left:14px;font-size:10px;color:var(--text-muted);flex-shrink:0;'});
  function buildLegend() {
    legend.innerHTML = '';
    if (STATE.timelineLineMode !== 'source') {
      legend.textContent = 'Dot = entity · Arrow = flow';
      return;
    }
    const senders = Array.from(new Set(dated.map(t => t.from))).sort();
    senders.slice(0, 8).forEach(ent => {
      const item = el('span', {style:'display:inline-flex;align-items:center;gap:4px;white-space:nowrap;'});
      const swatch = el('span', {
        title: `Click to set arrow color for ${ent}`,
        style:`width:14px;height:0;border-top:2.5px solid ${srcColors.get(ent) || STATE.edgeColor};display:inline-block;cursor:pointer;`
      });
      const inp = el('input', {type:'color', value: srcColors.get(ent) || STATE.edgeColor,
        style:'position:absolute;opacity:0;width:0;height:0;pointer-events:none;'});
      swatch.addEventListener('click', e => { e.stopPropagation(); inp.click(); });
      inp.addEventListener('input', e => {
        STATE.timelineSourceColors[ent] = e.target.value;
        srcColors = tlSourceColorMap();

      });
      swatch.addEventListener('contextmenu', e => {
        e.preventDefault(); e.stopPropagation();

      });
      swatch.appendChild(inp);
      item.appendChild(swatch);
      item.appendChild(el('span', {
        textContent: (dn => dn.length > 18 ? dn.slice(0, 17) + '…' : dn)(displayName(ent)),
        title: displayName(ent),
        style: STATE.timelineSourceColors[ent] ? 'text-decoration:underline dotted;' : ''
      }));
      legend.appendChild(item);
    });
    if (senders.length > 8) legend.appendChild(el('span', {textContent: `+${senders.length - 8} more`, style:'opacity:0.7'}));
  }
  ctrlBar.appendChild(legend);
  ctrlBar.appendChild(stepLabel);
  container.appendChild(ctrlBar);

  /* ================= body ================= */
  const body = el('div', {className: 'tl-body'});
  const labelCol = el('div', {className: 'tl-labels', style: `width:${LABEL_W}px;`});
  const canvasWrap = el('div', {className: 'tl-canvas-wrap'});
  const headerBar = el('div', {className: 'tl-header'});
  const grid = el('div', {className: 'tl-grid'});
  canvasWrap.appendChild(headerBar); canvasWrap.appendChild(grid);
  body.appendChild(labelCol); body.appendChild(canvasWrap);
  container.appendChild(body);

  const allDotEls = [], allLineEls = [];
  let tickXs = [];

  function buildHeader() {
    headerBar.innerHTML = '';
    headerBar.style.minWidth = timeW + 'px';
        const ticks = tlGenerateTicks(minDate, maxDate, STATE.timelineAxisMode, plotW);
    tickXs = [];
    ticks.forEach(tk => {
      const x = xFor(tk.ts);
      tickXs.push(x);
      const tick = el('div', {className: 'tl-tick', style: `left:${x}px;`});
      tick.appendChild(el('span', {
        className: 'tl-tick-label',
        textContent: tk.label,
        style: `font-family:${f.family};font-size:${f.size}px;color:${f.color};font-weight:${f.bold?'bold':'normal'};font-style:${f.italic?'italic':'normal'};`
      }));
      headerBar.appendChild(tick);
    });
    $$('.tl-grid-line', grid).forEach((ln, i) => { if (tickXs[i] != null) ln.style.left = tickXs[i] + 'px'; });
  }

  function buildLabels() {
    labelCol.innerHTML = '';
    labelCol.style.paddingTop = '30px'; // clears the sticky header row
    entities.forEach((entity, idx) => {
      const row = el('div', {className: 'tl-label-row', style: `height:${ROW_H}px;${idx % 2 === 0 ? 'background:rgba(255,255,255,0.015);' : ''}`, title: entity, draggable: 'true'});
      row.dataset.entity = entity;
      const entityColor = STATE.nodeColors[entity] || STATE.nodeColor;
      if (STATE.nodeIcons[entity]) {
        row.appendChild(el('img', {src: STATE.nodeIcons[entity], style: `width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid ${entityColor};pointer-events:none;`}));
      } else {
        row.appendChild(el('span', {style: `width:9px;height:9px;border-radius:50%;background:${entityColor};flex-shrink:0;border:1px solid rgba(255,255,255,0.12);`}));
      }
      row.appendChild(el('span', {style: 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;', textContent: displayName(entity)}));

      row.addEventListener('click', () => {
        const cy = getActiveCy(); if (!cy) return;
        cy.elements().removeClass('highlighted dimmed tl-dimmed tl-current tl-played');
        cy.elements().addClass('dimmed');
        const node = cy.getElementById(resolveEntityToGroupNode(entity));
        if (node.length) {
          node.removeClass('dimmed').addClass('highlighted');
          node.connectedEdges().removeClass('dimmed').addClass('highlighted');
          node.neighborhood('node').removeClass('dimmed').addClass('highlighted');
        }
      });
      row.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', entity); e.dataTransfer.effectAllowed = 'move'; row.classList.add('dragging'); });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', e => {
        e.preventDefault(); row.classList.remove('drag-over');
        const dragged = e.dataTransfer.getData('text/plain');
        if (dragged === entity) return;
        const fromIdx = entities.indexOf(dragged), toIdx = entities.indexOf(entity);
        if (fromIdx < 0 || toIdx < 0) return;
        entities.splice(fromIdx, 1); entities.splice(toIdx, 0, dragged);
        STATE._timelineEntityOrder = [...entities];
        entityIdx = new Map(entities.map((e2, i) => [e2, i]));
        rebuildContent();
      });
      labelCol.appendChild(row);
    });
  }

  function rebuildContent() {
    grid.innerHTML = '';
    allDotEls.length = 0; allLineEls.length = 0;
        grid.style.width = timeW + 'px';
    grid.style.height = (entities.length * ROW_H) + 'px';
    canvasWrap.style.width = timeW + 'px';
    buildLabels();

    entities.forEach((entity, idx) => {
      grid.appendChild(el('div', {className: 'tl-row-bg', style: `top:${idx*ROW_H}px;height:${ROW_H}px;${idx%2===0?'background:rgba(255,255,255,0.015);':''}`}));
    });
    tickXs.forEach(x => grid.appendChild(el('div', {className: 'tl-grid-line', style: `left:${x}px;`})));

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.style.cssText = `position:absolute;top:0;left:0;pointer-events:none;z-index:10;overflow:visible;`;
    svg.setAttribute('width', String(timeW));
    svg.setAttribute('height', String(entities.length * ROW_H));
    const defs = document.createElementNS(svgNS, 'defs');
    const marker = document.createElementNS(svgNS, 'marker');
    marker.setAttribute('id', 'tl-arrow');
    const aSz = STATE.timelineArrowSize || 8;
    marker.setAttribute('viewBox', '0 0 8 8');
    marker.setAttribute('refX', '7'); marker.setAttribute('refY', '4');
    marker.setAttribute('markerWidth', String(aSz)); marker.setAttribute('markerHeight', String(aSz));
    marker.setAttribute('markerUnits', 'userSpaceOnUse');
    marker.setAttribute('orient', 'auto');
    const arrowPath = document.createElementNS(svgNS, 'path');
    arrowPath.setAttribute('d', 'M 0 0.5 L 7 4 L 0 7.5 z');
    arrowPath.setAttribute('fill', 'context-stroke');
    marker.appendChild(arrowPath); defs.appendChild(marker); svg.appendChild(defs);

    const dotCountMap = new Map();
    dated.forEach(t => {
            const x = xFor(t.date.getTime());
      const dateKey = t.date.toISOString().slice(0, 10);
      const fromI = entityIdx.get(t.from), toI = entityIdx.get(t.to);
      if (fromI === undefined || toI === undefined) return;
      const fromY = fromI * ROW_H + ROW_H / 2, toY = toI * ROW_H + ROW_H / 2;

      function getDotOffset(entity) {
        const key = `${entity}||${dateKey}`;
        const count = dotCountMap.get(key) || 0;
        dotCountMap.set(key, count + 1);
        return (count % 3 - 1) * Math.min(10, ROW_H * 0.2);
      }

            let lineColor, lineOpacity;
      if (STATE.timelineLineMode === 'source') {
        lineColor = srcColors.get(t.from) || STATE.edgeColor;
        lineOpacity = 0.75;
      } else if (useDir) {
        if (t.to === STATE.mainEntity) { lineColor = STATE.inColor; lineOpacity = 0.6; }
        else if (t.from === STATE.mainEntity) { lineColor = STATE.outColor; lineOpacity = 0.6; }
        else { lineColor = STATE.edgeColor; lineOpacity = 0.2; }
      } else { lineColor = STATE.edgeColor; lineOpacity = 0.3; }

      const lw = getLineWidth(t.amount);
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', String(x)); line.setAttribute('y1', String(fromY));
      line.setAttribute('x2', String(x)); line.setAttribute('y2', String(toY));
      line.setAttribute('stroke', lineColor);
      line.setAttribute('stroke-opacity', String(lineOpacity));
      line.setAttribute('stroke-width', String(lw));
      line.setAttribute('stroke-dasharray', `${Math.max(6, lw*3)},${Math.max(3, lw*1.5)}`);
      line.setAttribute('marker-end', 'url(#tl-arrow)');
      line.classList.add('tl-flow-line');
      svg.appendChild(line);
      allLineEls.push({el: line, txn: t, dateKey});

      [['from', t.from, fromY], ['to', t.to, toY]].forEach(([kind, ent, baseY]) => {
        const c = STATE.nodeColors[ent] || STATE.nodeColor;
        const dot = el('div', {
          className: 'tl-dot',
          style: `left:${x}px;top:${baseY + getDotOffset(ent)}px;transform:translate(-50%,-50%);width:${DOT_R*2}px;height:${DOT_R*2}px;background:${c};border-color:${c};`,
          title: `${kind === 'from' ? '→ ' + t.to : '← ' + t.from}\n${formatAmount(Math.abs(t.amount))}\n${t.date.toLocaleDateString()}${t.desc ? '\n' + t.desc : ''}`
        });
        dot.addEventListener('click', e => { e.stopPropagation(); highlightTxnOnGraph(t); });
        grid.appendChild(dot);
        allDotEls.push({el: dot, txn: t, dateKey, type: kind});
      });
    });
    grid.appendChild(svg);

    // gap overlays
    if (dated.length > 2) {
      const sortedDates = [...new Set(dated.map(t => t.date.toISOString().slice(0,10)))].sort();
      for (let i = 1; i < sortedDates.length; i++) {
        const d1 = new Date(sortedDates[i-1]).getTime(), d2 = new Date(sortedDates[i]).getTime();
        const daysDiff = (d2 - d1) / 86400000;
        if (daysDiff > 14) {
                    const x1 = xFor(d1), x2 = xFor(d2);
          const overlay = el('div', {className: 'tl-gap-overlay', style: `left:${x1}px;width:${x2-x1}px;`});
          overlay.appendChild(el('div', {className: 'tl-gap-label', textContent: `${Math.round(daysDiff)}d gap`}));
          grid.appendChild(overlay);
        }
      }
    }
    // restore playback visuals after a rebuild
    if (playedDateSet.size > 0) {
      grid.classList.add('tl-playing');
      allDotEls.forEach(d => {
        if (playedDateSet.has(d.dateKey)) d.el.classList.add('played');
        else d.el.classList.add('tl-future');
      });
      allLineEls.forEach(l => {
        if (playedDateSet.has(l.dateKey)) l.el.classList.add('played');
        else l.el.classList.add('tl-future');
      });
    }
  }

  function rebuildAll() {
    plotW = Math.round((baseW - PAD_X * 2) * (STATE.timelineZoom || 1));
    timeW = plotW + PAD_X * 2;
    DOT_R = Math.max(3.5, Math.min(7, ROW_H / 8)) * (STATE.timelineDotScale || 1);
    useDir = STATE.useDirectionColors && STATE.mainEntity;
    srcColors = tlSourceColorMap();
    buildLegend();
    buildHeader();
    rebuildContent();
  }
  STATE._tlRefresh = rebuildAll;

  zoomLbl.textContent = Math.round((STATE.timelineZoom || 1) * 100) + '%';
  buildLegend();
  rebuildAll();

  /* ================= graph sync ================= */
  function highlightTxnOnGraph(t) {
    const cy = getActiveCy(); if (!cy) return;
    cy.elements().removeClass('highlighted dimmed tl-current tl-played');
        cy.elements().addClass('dimmed');
    let c = '#f0e68c';
    if (useDir) {
      if (t.to === STATE.mainEntity) c = STATE.inColor;
      else if (t.from === STATE.mainEntity) c = STATE.outColor;
      else c = STATE.edgeColor;
    }
    const els = tlElementsFor(cy, t);
    els.nodes().forEach(n => n.data('hlColor', c));
    els.removeClass('dimmed tl-dimmed').addClass('tl-current');
}
  function highlightDateOnGraph(dateKey) {
    const cy = getActiveCy(); if (!cy) return;
        cy.$('.tl-current').removeClass('tl-current').addClass('tl-played');
    let coll = cy.collection();
    (byDate.get(dateKey) || []).forEach(t => {
      let c = '#f0e68c';
      if (useDir) {
        if (t.to === STATE.mainEntity) c = STATE.inColor;
        else if (t.from === STATE.mainEntity) c = STATE.outColor;
        else c = STATE.edgeColor;
      }
      const els = tlElementsFor(cy, t);
      els.nodes().forEach(n => n.data('hlColor', c));
      coll = coll.union(els);
    });
    coll.removeClass('dimmed tl-dimmed tl-played').addClass('tl-current');
  }

  function markDatePlayed(dateKey) {
    playedDateSet.add(dateKey);
    allDotEls.forEach(d => {
      if (d.dateKey === dateKey) { d.el.classList.remove('tl-future', 'played'); d.el.classList.add('playing'); }
      else if (playedDateSet.has(d.dateKey)) { d.el.classList.remove('playing', 'tl-future'); d.el.classList.add('played'); }
    });
    allLineEls.forEach(l => {
      if (l.dateKey === dateKey) { l.el.classList.remove('tl-future', 'played'); l.el.classList.add('active'); }
      else if (playedDateSet.has(l.dateKey)) { l.el.classList.remove('active', 'tl-future'); l.el.classList.add('played'); }
    });
    // keep the playhead in view when zoomed in
            const x = xFor(new Date(dateKey).getTime());
    const w = body.clientWidth - LABEL_W;
    if (x < body.scrollLeft || x > body.scrollLeft + w - 40) {
      body.scrollLeft = Math.max(0, x - w / 2);
    }
  }

  function stopPlay() {
    clearInterval(playInterval); playInterval = null; STATE._tlPlayInterval = null;
    playBtn.textContent = '▶ Resume'; replayBtn.style.display = '';
  }
  function resetPlay() {
    playIndex = 0; stepLabel.textContent = '';
    playedDateSet.clear();
    playBtn.textContent = '▶ Play'; replayBtn.style.display = 'none';
    grid.classList.remove('tl-playing');
    allDotEls.forEach(d => d.el.classList.remove('played','playing','tl-future'));
    allLineEls.forEach(l => l.el.classList.remove('active','played','tl-future'));
    const cy = getActiveCy();
    if (cy) cy.elements().removeClass('highlighted dimmed tl-dimmed anomaly-highlight tl-current tl-played');
  }
  function playStep() {
    if (!playInterval) return;
    if (playIndex >= dateKeys.length) { stopPlay(); return; }
    const dateKey = dateKeys[playIndex];
    stepLabel.textContent = `${dateKey}  (${playIndex + 1}/${dateKeys.length})`;
    markDatePlayed(dateKey);
    highlightDateOnGraph(dateKey);
    playIndex++;
  }

  replayBtn.addEventListener('click', resetPlay);
  playBtn.addEventListener('click', () => {
    if (playInterval) { stopPlay(); return; }
    if (playedDateSet.size === 0) playIndex = 0;
    playBtn.textContent = '⏹ Stop'; replayBtn.style.display = 'none';
    grid.classList.add('tl-playing');
    allDotEls.forEach(d => { if (!playedDateSet.has(d.dateKey)) d.el.classList.add('tl-future'); });
    allLineEls.forEach(l => { if (!playedDateSet.has(l.dateKey)) l.el.classList.add('tl-future'); });
    const cy = getActiveCy();
    if (cy) { cy.elements().removeClass('highlighted anomaly-highlight tl-current tl-played'); cy.elements().addClass('tl-dimmed'); }
    playInterval = STATE._tlPlayInterval = setInterval(playStep, parseInt(speedSel.value));
  });
}


/* ==========================================================================
   NARRATIVE SUMMARY
   ========================================================================== */
function generateSummary() {
  const txns = STATE.transactions;
  const entities = STATE.entities;
  const totalAmt = txns.reduce((s, t) => s + Math.abs(t.amount || 0), 0);
  const dates = txns.map(t => t.date).filter(Boolean).sort((a, b) => a - b);
  const dateRange = dates.length ? `${dates[0].toLocaleDateString()} to ${dates[dates.length-1].toLocaleDateString()}` : 'N/A';

  // Top relationships
  const pairs = Array.from(STATE.entityPairs.values()).sort((a, b) => b.total - a.total);
  const topPairs = pairs.slice(0, 5);

  // Most active entities
  const sortedEntities = Array.from(entities.values()).sort((a, b) => b.txnCount - a.txnCount);
  const topEntities = sortedEntities.slice(0, 5);

  let text = `TRANSACTION ANALYSIS SUMMARY\n${'='.repeat(40)}\n\n`;
  text += `Total Entities: ${entities.size}\n`;
  text += `Total Transactions: ${txns.length}\n`;
  text += `Total Transaction Amount: ${formatAmount(totalAmt)}\n`;
  text += `Date Range: ${dateRange}\n\n`;

  text += `MOST ACTIVE ENTITIES\n${'-'.repeat(30)}\n`;
  topEntities.forEach((e, i) => {
    text += `${i+1}. ${e.name} — ${e.txnCount} transactions, In: ${formatAmount(e.totalIn)}, Out: ${formatAmount(e.totalOut)}\n`;
  });

  text += `\nMOST SIGNIFICANT RELATIONSHIPS\n${'-'.repeat(30)}\n`;
  topPairs.forEach((p, i) => {
    text += `${i+1}. ${p.from} → ${p.to} — ${p.count} transactions totaling ${formatAmount(p.total)}\n`;
  });

  if (STATE.anomalies.length > 0) {
    text += `\nKEY FINDINGS\n${'-'.repeat(30)}\n`;
    STATE.anomalies.slice(0, 10).forEach((a, i) => {
      text += `${i+1}. [${a.type.toUpperCase()}] ${a.desc}\n`;
    });
  }

  return text;
}

function showSummary() {
  STATE.summaryText = generateSummary();
  $('#summary-text').textContent = STATE.summaryText;
  $('#summary-modal').classList.add('active');
  // Bind close handlers directly (resilient to bindGlobalEvents failures)
  $('#summary-close').onclick = () => $('#summary-modal').classList.remove('active');
  $('#summary-copy').onclick = () => {
    navigator.clipboard.writeText(STATE.summaryText).then(() => alert('Copied to clipboard.'));
  };
  $('#summary-modal').onclick = e => {
    if (e.target === $('#summary-modal')) $('#summary-modal').classList.remove('active');
  };
}



/* ==========================================================================
   PDF EXPORT
   ========================================================================== */
async function exportPDF() {
  showLoading('Generating PDF...');
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    const header = $('#exp-header').value || 'Transaction Intelligence Report';
    const caseRef = $('#exp-case').value;
    const watermark = $('#exp-watermark').value;

    // Header
    pdf.setFontSize(18);
    pdf.setTextColor(88, 166, 255);
    pdf.text(header, pageW / 2, 15, {align: 'center'});
    if (caseRef) {
      pdf.setFontSize(10);
      pdf.setTextColor(139, 148, 158);
      pdf.text(`Case Reference: ${caseRef}`, pageW / 2, 22, {align: 'center'});
    }

    // Watermark
    if (watermark) {
      pdf.setFontSize(40);
      pdf.setTextColor(200, 200, 200);
      pdf.setGState(new pdf.GState({opacity: 0.1}));
      pdf.text(watermark, pageW / 2, pageH / 2, {align: 'center', angle: 45});
      pdf.setGState(new pdf.GState({opacity: 1}));
    }

    // Capture graph from Cytoscape directly
    const cy = getActiveCy();
    if (cy) {
      const imgData = cy.png({full: true, scale: 2, bg: STATE.bgColor});
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = imgData;
      });
      const availW = pageW - 20;
      const availH = pageH - 40;
      const imgAspect = img.naturalWidth / img.naturalHeight;
      const availAspect = availW / availH;
      let finalW, finalH;
      if (imgAspect > availAspect) {
        // Image is wider than available area — fit to width
        finalW = availW;
        finalH = availW / imgAspect;
      } else {
        // Image is taller than available area — fit to height
        finalH = availH;
        finalW = availH * imgAspect;
      }
      const offsetX = 10 + (availW - finalW) / 2;
      const offsetY = 28 + (availH - finalH) / 2;
      pdf.addImage(imgData, 'PNG', offsetX, offsetY, finalW, finalH);
    }

    // Timeline capture
    const tlCanvas = document.querySelector('#timeline-container canvas');
    if (tlCanvas && STATE.showTimeline) {
      pdf.addPage();
      if (watermark) {
        pdf.setFontSize(40);
        pdf.setTextColor(200, 200, 200);
        pdf.setGState(new pdf.GState({opacity: 0.1}));
        pdf.text(watermark, pageW / 2, pageH / 2, {align: 'center', angle: 45});
        pdf.setGState(new pdf.GState({opacity: 1}));
      }
      pdf.setFontSize(14);
      pdf.setTextColor(88, 166, 255);
      pdf.text('Timeline View', 10, 15);
      const tlImg = tlCanvas.toDataURL('image/png');
      const tlW = pageW - 20;
      const tlH = (tlCanvas.height / tlCanvas.width) * tlW;
      pdf.addImage(tlImg, 'PNG', 10, 20, tlW, Math.min(tlH, pageH - 30));
    }

    // Summary page
    if (STATE.summaryText) {
      pdf.addPage();
      if (watermark) {
        pdf.setFontSize(40);
        pdf.setTextColor(200, 200, 200);
        pdf.setGState(new pdf.GState({opacity: 0.1}));
        pdf.text(watermark, pageW / 2, pageH / 2, {align: 'center', angle: 45});
        pdf.setGState(new pdf.GState({opacity: 1}));
      }
      pdf.setFontSize(14);
      pdf.setTextColor(88, 166, 255);
      pdf.text('Narrative Summary', 10, 15);
      pdf.setFontSize(9);
      pdf.setTextColor(139, 148, 158);
      const lines = pdf.splitTextToSize(STATE.summaryText, pageW - 20);
      pdf.text(lines, 10, 25);
    }

    // Date stamp
    pdf.setFontSize(8);
    pdf.setTextColor(110, 118, 129);
    pdf.text(`Generated: ${new Date().toLocaleString()}`, 10, pageH - 5);

    pdf.save(`transaction_report_${new Date().toISOString().slice(0,10)}.pdf`);
    $('#export-modal').classList.remove('active');
  } catch (err) {
    alert('PDF export error: ' + err.message);
  }
  hideLoading();
}

/* ==========================================================================
   GROUP MANAGEMENT
   ========================================================================== */
function getEntityGroup(entityName) {
  for (const [id, g] of STATE.groups) { if (g.members.has(entityName)) return g; }
  return null;
}
function getGroupNodeId(group) { return `__group__${group.id}`; }
function resolveEntityToGroupNode(entityName) {
  const g = getEntityGroup(entityName);
  return g ? getGroupNodeId(g) : entityName;
}

function openGroupModal(memberNames, existingGroupId) {
  const modal = $('#group-modal');
  const nameInput = $('#gm-name');
  const colorInput = $('#gm-color');
  const deleteBtn = $('#gm-delete');
  const membersDiv = $('#gm-members');
  const addSelect = $('#gm-add-select');
  let workingMembers = new Set(memberNames || []);
  let editingId = existingGroupId || null;
  if (editingId && STATE.groups.has(editingId)) {
    const g = STATE.groups.get(editingId);
    nameInput.value = g.name; colorInput.value = g.color || '#f0a500';
    workingMembers = new Set(g.members); deleteBtn.style.display = '';
  } else {
    nameInput.value = `Group ${STATE._groupCounter + 1}`; colorInput.value = '#f0a500'; deleteBtn.style.display = 'none';
  }
  function refreshAddSelect() {
    addSelect.innerHTML = '';
    Array.from(STATE.entities.keys()).sort().forEach(name => {
      if (workingMembers.has(name)) return;
      addSelect.appendChild(el('option', {value: name, textContent: name}));
    });
  }
function renderMembers() {
    membersDiv.innerHTML = '';
    if (workingMembers.size === 0) { membersDiv.innerHTML = '<span style="color:var(--text-muted);font-size:11px">No members yet</span>'; return; }
    workingMembers.forEach(name => {
      const tag = el('span', {className: 'group-member-tag'});
      tag.appendChild(el('span', {textContent: name}));
      const rm = el('span', {className: 'rm', innerHTML: '&times;'});
      rm.addEventListener('click', () => { workingMembers.delete(name); renderMembers(); refreshAddSelect(); });
      tag.appendChild(rm); membersDiv.appendChild(tag);
    });
  }
  refreshAddSelect(); renderMembers();
  $('#gm-add-btn').onclick = () => { const v = addSelect.value; if (v) { workingMembers.add(v); renderMembers(); refreshAddSelect(); } };
  deleteBtn.onclick = () => {
    const cy = getActiveCy();
    if (cy) {
      const pos = {};
      cy.nodes().forEach(n => { pos[n.id()] = {...n.position()}; });
      if (editingId && STATE.groups.has(editingId)) {
        const groupNodeId = `__group__${editingId}`;
        const groupNode = cy.getElementById(groupNodeId);
        if (groupNode.length) {
          const gx = groupNode.position('x');
          const gy = groupNode.position('y');
          const members = Array.from(STATE.groups.get(editingId).members);
          members.forEach((m, i) => {
            const angle = (2 * Math.PI * i) / members.length;
            pos[m] = {x: gx + Math.cos(angle) * 80, y: gy + Math.sin(angle) * 80};
          });
        }
      }
      STATE._savedPositions = pos;
    }
    if (editingId) STATE.groups.delete(editingId);
    modal.classList.remove('active'); renderGraphs(); buildGroupsSidebarSection();
  };
  $('#gm-cancel').onclick = () => modal.classList.remove('active');

  $('#gm-save').onclick = () => {
    const name = nameInput.value.trim() || `Group ${STATE._groupCounter + 1}`;
    const color = colorInput.value || '#f0a500';
    if (workingMembers.size < 2) { alert('A group needs at least 2 members.'); return; }

    // Capture positions BEFORE mutating STATE.groups
    const cy = getActiveCy();
    const pos = {};
    let groupCentroid = null;

    if (cy) {
      cy.nodes().forEach(n => { pos[n.id()] = {...n.position()}; });

      if (!editingId) {
        // New group: compute centroid from the member nodes that exist right now
        let cx = 0, cy2 = 0, count = 0;
        workingMembers.forEach(m => {
          const n = cy.getElementById(m);
          if (n.length) { cx += n.position('x'); cy2 += n.position('y'); count++; }
        });
        if (count > 0) {
          groupCentroid = { x: cx / count, y: cy2 / count };
        }
      } else {
        // Editing: reuse the existing group node position if it exists
        const existingGroupNodeId = `__group__${editingId}`;
        const existingGroupNode = cy.getElementById(existingGroupNodeId);
        if (existingGroupNode.length) {
          groupCentroid = { ...existingGroupNode.position() };
        } else {
          // Group node not on canvas yet — compute from member positions
          let cx = 0, cy2 = 0, count = 0;
          workingMembers.forEach(m => {
            const n = cy.getElementById(m);
            if (n.length) { cx += n.position('x'); cy2 += n.position('y'); count++; }
          });
          if (count > 0) groupCentroid = { x: cx / count, y: cy2 / count };
        }
      }
    }

    // NOW mutate state
    if (editingId) {
      STATE.groups.get(editingId).name = name;
      STATE.groups.get(editingId).color = color;
      STATE.groups.get(editingId).members = new Set(workingMembers);
    } else {
      STATE._groupCounter++;
      const id = `grp_${STATE._groupCounter}`;
      STATE.groups.set(id, { id, name, members: new Set(workingMembers), color });
      editingId = id; // so we can build the group node ID below
    }

    // Inject the group node's target position so renderCy can restore it
    if (cy && groupCentroid) {
      const groupNodeId = `__group__${editingId}`;
      pos[groupNodeId] = groupCentroid;
    }

    STATE._savedPositions = pos;
    modal.classList.remove('active');
    renderGraphs();
    buildGroupsSidebarSection();
  };
  modal.classList.add('active'); nameInput.focus(); nameInput.select();
}

function applyGroupsToElements(nodes, edges) {
  if (STATE.groups.size === 0) return {nodes, edges};
  const groupedEntitySet = new Set();
  STATE.groups.forEach(g => g.members.forEach(m => groupedEntitySet.add(m)));
  const filteredNodes = nodes.filter(n => !groupedEntitySet.has(n.data.id));
  const groupNodes = [];
  STATE.groups.forEach(g => {
    let totalIn = 0, totalOut = 0, txnCount = 0; const memberList = [];
    g.members.forEach(m => { const eData = STATE.entities.get(m); if (eData) { totalIn += eData.totalIn; totalOut += eData.totalOut; txnCount += eData.txnCount; memberList.push(m); } });
    const sz = typeof STATE.nodeSize === 'number' ? Math.max(STATE.nodeSize, 55) : 55;
    groupNodes.push({data: {id: getGroupNodeId(g), label: `${g.name}\n(${g.members.size} entities)`, size: sz, txnCount, totalIn, totalOut, isGroup: true, groupId: g.id, groupColor: g.color, shape: 'hexagon', hasIcon: false, iconUrl: '', hlColor: '#f0e68c'}});
  });
  const mergedEdgeMap = new Map(); const filteredEdges = [];
  edges.forEach(e => {
    const src = e.data.source; const tgt = e.data.target;
    const newSrc = resolveEntityToGroupNode(src); const newTgt = resolveEntityToGroupNode(tgt);
    if (newSrc === newTgt) return;
    if (newSrc !== src || newTgt !== tgt) {
      const key = `${newSrc}|||${newTgt}`;
      if (!mergedEdgeMap.has(key)) mergedEdgeMap.set(key, {id: `merged_${key}`, source: newSrc, target: newTgt, label: '', amount: 0, count: 0, txns: [], color: e.data.color, thickness: e.data.thickness, arrowScale: e.data.arrowScale, isMerged: true});
      const m = mergedEdgeMap.get(key);
      m.amount += Math.abs(e.data.amount || 0); m.count += (e.data.count || 1);
      if (e.data.txns) m.txns.push(...e.data.txns); else m.txns.push({from: src, to: tgt, amount: e.data.amount, date: e.data.date ? new Date(e.data.date) : null, desc: e.data.desc});
    } else { filteredEdges.push(e); }
  });
  mergedEdgeMap.forEach(m => {
    m.label = `${formatAmount(m.amount)} (${m.count})`;
    if (STATE.edgeThicknessScale) { const allAmts = [...filteredEdges.map(e => Math.abs(e.data.amount||0)), ...Array.from(mergedEdgeMap.values()).map(e => e.amount)]; const maxA = Math.max(...allAmts, 1); m.thickness = 1 + (m.amount / maxA) * 8; }
  });
  return {nodes: [...filteredNodes, ...groupNodes], edges: [...filteredEdges, ...Array.from(mergedEdgeMap.values()).map(m => ({data: m}))]};
}

   ANNOTATIONS

let _annotationCounter = 0;

function addAnnotation(graphContainer, x, y) {
  _annotationCounter++;
  const id = `annot_${_annotationCounter}`;
  const ann = {
    id, x: x || 100, y: y || 100,
    html: '', fontSize: 12, color: '#e6edf3',
    bgColor: 'rgba(255,255,255,0.08)', borderColor: '#484f58',
    align: 'left', fontFamily: 'sans-serif',
    bold: false, italic: false,
    width: null, height: null, imageUrl: null
  };
  STATE.annotations.push(ann);
  renderAnnotation(ann, graphContainer);
  return ann;
}

function renderAnnotation(ann, containerEl) {
  const container = typeof containerEl === 'string' ? document.getElementById(containerEl) : containerEl;
  if (!container) return;
  container.style.position = 'relative';

  const box = el('div', {className: 'annotation-box', id: ann.id});
  box.style.left = ann.x + 'px';
  box.style.top = ann.y + 'px';
  box.style.fontSize = (ann.fontSize || 12) + 'px';
  box.style.color = ann.color || '#e6edf3';
  box.style.background = ann.bgColor || 'rgba(255,255,255,0.08)';
  box.style.textAlign = ann.align || 'left';
  box.style.fontFamily = ann.fontFamily || 'sans-serif';
  if (ann.width) box.style.width = ann.width + 'px';
  if (ann.height) box.style.height = ann.height + 'px';
  box.style.borderStyle = ann.showBorder !== false ? (ann.borderStyle || 'solid') : 'none';
  box.style.borderWidth = ann.showBorder !== false ? (ann.borderWidth || 1) + 'px' : '0';
  box.style.borderColor = ann.showBorder !== false ? (ann.borderColor || '#484f58') : 'transparent';

  // Text content — must exist before toolbar so execCommand can target it
  const textEl = el('div', {className: 'annotation-text', contentEditable: 'true'});
  textEl.innerHTML = ann.html || '';
  textEl.style.color = ann.color || '#e6edf3';
  textEl.addEventListener('input', () => { ann.html = textEl.innerHTML; });
  textEl.addEventListener('mousedown', e => e.stopPropagation());
  textEl.addEventListener('keydown', e => e.stopPropagation());

  // Helper: run execCommand while keeping focus in textEl
  function exec(cmd, val) {
    textEl.focus();
    document.execCommand(cmd, false, val || null);
    ann.html = textEl.innerHTML;
  }

  // Helper: check if current selection has a command active
  function isActive(cmd) {
    return document.queryCommandState(cmd);
  }

  // Controls toolbar
  const controls = el('div', {className: 'annotation-controls'});

  // Font family
  const fontSel = el('select', {style: 'height:22px;font-size:9px;padding:0 2px;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);border-radius:3px;cursor:pointer;max-width:70px;', title: 'Font family'});
  ['sans-serif','serif','monospace','Arial','Georgia','Courier New','Times New Roman','Verdana'].forEach(f => {
    fontSel.appendChild(el('option', {value: f, textContent: f}));
  });
  fontSel.value = ann.fontFamily || 'sans-serif';
  fontSel.addEventListener('change', e => { e.stopPropagation(); exec('fontName', e.target.value); });
  fontSel.addEventListener('mousedown', e => e.stopPropagation());
  controls.appendChild(fontSel);

  // Font size
  const sizeSel = el('select', {style: 'height:22px;font-size:9px;padding:0 2px;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);border-radius:3px;cursor:pointer;max-width:36px;', title: 'Font size'});
  [1,2,3,4,5,6,7].forEach(s => {
    const labels = {1:'8',2:'10',3:'12',4:'14',5:'18',6:'24',7:'36'};
    sizeSel.appendChild(el('option', {value: String(s), textContent: labels[s]}));
  });
  sizeSel.value = '3';
  sizeSel.addEventListener('change', e => { e.stopPropagation(); exec('fontSize', e.target.value); });
  sizeSel.addEventListener('mousedown', e => e.stopPropagation());
  controls.appendChild(sizeSel);

  controls.appendChild(el('div', {className: 'ctrl-divider'}));

  // Bold
  const boldBtn = el('button', {title: 'Bold (selection)', innerHTML: '<b>B</b>'});
  boldBtn.addEventListener('click', e => { e.stopPropagation(); exec('bold'); boldBtn.classList.toggle('active', isActive('bold')); });
  controls.appendChild(boldBtn);

  // Italic
  const italicBtn = el('button', {title: 'Italic (selection)', innerHTML: '<i>I</i>'});
  italicBtn.addEventListener('click', e => { e.stopPropagation(); exec('italic'); italicBtn.classList.toggle('active', isActive('italic')); });
  controls.appendChild(italicBtn);

  // Underline
  const underBtn = el('button', {title: 'Underline (selection)', innerHTML: '<u>U</u>'});
  underBtn.addEventListener('click', e => { e.stopPropagation(); exec('underline'); underBtn.classList.toggle('active', isActive('underline')); });
  controls.appendChild(underBtn);

  // Strikethrough
  const strikeBtn = el('button', {title: 'Strikethrough (selection)', innerHTML: '<s>S</s>'});
  strikeBtn.addEventListener('click', e => { e.stopPropagation(); exec('strikethrough'); strikeBtn.classList.toggle('active', isActive('strikethrough')); });
  controls.appendChild(strikeBtn);

  controls.appendChild(el('div', {className: 'ctrl-divider'}));

  // Text color (selection)
  const colorBtn = el('button', {title: 'Text color (selection)', textContent: 'A'});
  colorBtn.style.textDecoration = 'underline';
  colorBtn.style.color = ann.color || '#e6edf3';
  const colorInp = el('input', {type: 'color', value: ann.color || '#e6edf3', style: 'position:absolute;opacity:0;width:0;height:0;pointer-events:none;'});
  colorBtn.addEventListener('click', e => { e.stopPropagation(); colorInp.click(); });
  colorInp.addEventListener('input', e => {
    exec('foreColor', e.target.value);
    colorBtn.style.color = e.target.value;
  });
  colorInp.addEventListener('mousedown', e => e.stopPropagation());
  colorBtn.appendChild(colorInp);
  controls.appendChild(colorBtn);

  // Highlight (selection background)
  const hlBtn = el('button', {title: 'Highlight (selection)', textContent: '🖍'});
  const hlInp = el('input', {type: 'color', value: '#ffff00', style: 'position:absolute;opacity:0;width:0;height:0;pointer-events:none;'});
  hlBtn.addEventListener('click', e => { e.stopPropagation(); hlInp.click(); });
  hlInp.addEventListener('input', e => { exec('hiliteColor', e.target.value); });
  hlInp.addEventListener('mousedown', e => e.stopPropagation());
  hlBtn.appendChild(hlInp);
  controls.appendChild(hlBtn);

  controls.appendChild(el('div', {className: 'ctrl-divider'}));

  // Align left
  const alignLBtn = el('button', {title: 'Align left', innerHTML: '⫷'});
  const alignCBtn = el('button', {title: 'Align center', innerHTML: '☰'});
  const alignRBtn = el('button', {title: 'Align right', innerHTML: '⫸'});
  function setAlign(val) {
    exec(val === 'left' ? 'justifyLeft' : val === 'center' ? 'justifyCenter' : 'justifyRight');
    [alignLBtn, alignCBtn, alignRBtn].forEach(b => b.classList.remove('active'));
    if (val === 'left') alignLBtn.classList.add('active');
    else if (val === 'center') alignCBtn.classList.add('active');
    else alignRBtn.classList.add('active');
    ann.align = val;
  }
  alignLBtn.addEventListener('click', e => { e.stopPropagation(); setAlign('left'); });
  alignCBtn.addEventListener('click', e => { e.stopPropagation(); setAlign('center'); });
  alignRBtn.addEventListener('click', e => { e.stopPropagation(); setAlign('right'); });
  if ((ann.align || 'left') === 'left') alignLBtn.classList.add('active');
  else if (ann.align === 'center') alignCBtn.classList.add('active');
  else if (ann.align === 'right') alignRBtn.classList.add('active');
  controls.appendChild(alignLBtn);
  controls.appendChild(alignCBtn);
  controls.appendChild(alignRBtn);

  controls.appendChild(el('div', {className: 'ctrl-divider'}));

  // Box background
  const bgBtn = el('button', {title: 'Box background', textContent: '◼'});
  const bgInp = el('input', {type: 'color', value: '#222222', style: 'position:absolute;opacity:0;width:0;height:0;pointer-events:none;'});
  bgBtn.addEventListener('click', e => { e.stopPropagation(); bgInp.click(); });
  bgInp.addEventListener('input', e => { ann.bgColor = e.target.value + '40'; box.style.background = ann.bgColor; });
  bgInp.addEventListener('mousedown', e => e.stopPropagation());
  bgBtn.appendChild(bgInp);
  controls.appendChild(bgBtn);

  controls.appendChild(el('div', {className: 'ctrl-divider'}));

  // Border toggle
  const borderBtn = el('button', {title: 'Toggle border', textContent: '▢', className: ann.showBorder !== false ? 'active' : ''});
  borderBtn.addEventListener('click', e => {
    e.stopPropagation();
    ann.showBorder = !ann.showBorder;
    borderBtn.classList.toggle('active');
    box.style.borderStyle = ann.showBorder ? (ann.borderStyle || 'solid') : 'none';
    box.style.borderWidth = ann.showBorder ? (ann.borderWidth || 1) + 'px' : '0';
    box.style.borderColor = ann.showBorder ? (ann.borderColor || '#484f58') : 'transparent';
    borderStyleSel.disabled = !ann.showBorder;
    borderWidthSel.disabled = !ann.showBorder;
    borderColorBtn.disabled = !ann.showBorder;
  });
  controls.appendChild(borderBtn);

  const borderStyleSel = el('select', {style: 'height:22px;font-size:9px;padding:0 2px;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);border-radius:3px;cursor:pointer;max-width:55px;', title: 'Border style'});
  ['solid','dashed','dotted','double'].forEach(s => {
    borderStyleSel.appendChild(el('option', {value: s, textContent: s, ...(s === (ann.borderStyle || 'solid') ? {selected:'selected'} : {})}));
  });
  borderStyleSel.disabled = ann.showBorder === false;
  borderStyleSel.addEventListener('change', e => { e.stopPropagation(); ann.borderStyle = e.target.value; box.style.borderStyle = ann.borderStyle; });
  borderStyleSel.addEventListener('mousedown', e => e.stopPropagation());
  controls.appendChild(borderStyleSel);

  const borderWidthSel = el('select', {style: 'height:22px;font-size:9px;padding:0 2px;background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-primary);border-radius:3px;cursor:pointer;max-width:38px;', title: 'Border width'});
  [1,2,3,4].forEach(w => {
    borderWidthSel.appendChild(el('option', {value: String(w), textContent: w + 'px', ...(w === (ann.borderWidth || 1) ? {selected:'selected'} : {})}));
  });
  borderWidthSel.disabled = ann.showBorder === false;
  borderWidthSel.addEventListener('change', e => { e.stopPropagation(); ann.borderWidth = parseInt(e.target.value); box.style.borderWidth = ann.borderWidth + 'px'; });
  borderWidthSel.addEventListener('mousedown', e => e.stopPropagation());
  controls.appendChild(borderWidthSel);

  const borderColorBtn = el('button', {title: 'Border color', textContent: '⬜'});
  borderColorBtn.style.color = ann.borderColor || '#484f58';
  borderColorBtn.disabled = ann.showBorder === false;
  const borderColorInp = el('input', {type: 'color', value: ann.borderColor || '#484f58', style: 'position:absolute;opacity:0;width:0;height:0;pointer-events:none;'});
  borderColorBtn.addEventListener('click', e => { e.stopPropagation(); borderColorInp.click(); });
  borderColorInp.addEventListener('input', e => { ann.borderColor = e.target.value; box.style.borderColor = ann.borderColor; borderColorBtn.style.color = ann.borderColor; });
  borderColorInp.addEventListener('mousedown', e => e.stopPropagation());
  borderColorBtn.appendChild(borderColorInp);
  controls.appendChild(borderColorBtn);

  controls.appendChild(el('div', {className: 'ctrl-divider'}));

  // Image upload
  const imgBtn = el('button', {title: 'Add image/logo', textContent: '🖼'});
  const imgInp = el('input', {type: 'file', accept: 'image/*', style: 'position:absolute;opacity:0;width:0;height:0;pointer-events:none;'});
  imgBtn.addEventListener('click', e => { e.stopPropagation(); imgInp.click(); });
  imgInp.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      ann.imageUrl = ev.target.result;
      const existing = box.querySelector('.annotation-img');
      if (existing) existing.remove();
      const imgEl = el('img', {className: 'annotation-img', src: ann.imageUrl});
      imgEl.addEventListener('mousedown', ev2 => ev2.stopPropagation());
      box.appendChild(imgEl);
    };
    reader.readAsDataURL(file);
  });
  imgInp.addEventListener('mousedown', e => e.stopPropagation());
  imgBtn.appendChild(imgInp);
  controls.appendChild(imgBtn);

  // Remove image (if exists)
  if (ann.imageUrl) {
    const rmImgBtn = el('button', {title: 'Remove image', textContent: '🗑'});
    rmImgBtn.addEventListener('click', e => {
      e.stopPropagation();
      ann.imageUrl = null;
      const existing = box.querySelector('.annotation-img');
      if (existing) existing.remove();
      rmImgBtn.remove();
    });
    controls.appendChild(rmImgBtn);
  }

  controls.appendChild(el('div', {className: 'ctrl-divider'}));

  // Delete
  const deleteBtn = el('button', {title: 'Delete text box', textContent: '×'});
  deleteBtn.style.color = '#f85149';
  deleteBtn.addEventListener('click', e => { e.stopPropagation(); STATE.annotations = STATE.annotations.filter(a => a.id !== ann.id); box.remove(); });
  controls.appendChild(deleteBtn);

  // Update active states on selection change
  textEl.addEventListener('mouseup', () => {
    boldBtn.classList.toggle('active', isActive('bold'));
    italicBtn.classList.toggle('active', isActive('italic'));
    underBtn.classList.toggle('active', isActive('underline'));
    strikeBtn.classList.toggle('active', isActive('strikethrough'));
  });
  textEl.addEventListener('keyup', () => {
    boldBtn.classList.toggle('active', isActive('bold'));
    italicBtn.classList.toggle('active', isActive('italic'));
    underBtn.classList.toggle('active', isActive('underline'));
    strikeBtn.classList.toggle('active', isActive('strikethrough'));
  });

  box.appendChild(controls);
  box.appendChild(textEl);

  // Restore image if saved
  if (ann.imageUrl) {
    const imgEl = el('img', {className: 'annotation-img', src: ann.imageUrl});
    imgEl.addEventListener('mousedown', e => e.stopPropagation());
    box.appendChild(imgEl);
  }

  // Save size on resize
  const resizeObs = new ResizeObserver(() => {
    ann.width = box.offsetWidth;
    ann.height = box.offsetHeight;
  });
  resizeObs.observe(box);

  // Dragging — skip if near resize handle (bottom-right 18x18 corner)
  let dragging = false, dragOffX = 0, dragOffY = 0;
  box.addEventListener('mousedown', e => {
    if (e.target.closest('.annotation-controls') || e.target.closest('.annotation-text') || e.target.closest('.annotation-img')) return;
    const rect = box.getBoundingClientRect();
    const fromRight = rect.right - e.clientX;
    const fromBottom = rect.bottom - e.clientY;
    if (fromRight < 18 && fromBottom < 18) return;
    dragging = true;
    dragOffX = e.clientX - box.offsetLeft;
    dragOffY = e.clientY - box.offsetTop;
    box.style.zIndex = 150;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    box.style.left = (e.clientX - dragOffX) + 'px';
    box.style.top = (e.clientY - dragOffY) + 'px';
    ann.x = e.clientX - dragOffX;
    ann.y = e.clientY - dragOffY;
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; box.style.zIndex = 100; }
  });

  container.appendChild(box);
  setTimeout(() => textEl.focus(), 50);
}

function renderAllAnnotations() {
  // Clear existing
  document.querySelectorAll('.annotation-box').forEach(b => b.remove());
  const container = document.getElementById('graph-area');
  if (!container) return;
  STATE.annotations.forEach(ann => renderAnnotation(ann, container));
}

/* ==========================================================================
   INIT
   ========================================================================== */
function init() {
  buildDOM();
  showUploadStep();
}

// Start
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();


</script>
</body>
</html>
