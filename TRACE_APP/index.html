<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction Intelligence Tool</title>
<style>
/* ===== RESET & BASE ===== */
/*moved to another folder test*/
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
  --bg-card: #1c2128; --border: #30363d; --border-light: #484f58;
  --text-primary: #e6edf3; --text-secondary: #8b949e; --text-muted: #6e7681;
  --accent: #58a6ff; --accent-hover: #79c0ff; --accent-dim: #1f6feb;
  --green: #3fb950; --red: #f85149; --orange: #d29922; --purple: #bc8cff;
  --yellow: #e3b341; --pink: #f778ba;
  --sidebar-width: 280px; --topbar-height: 48px; 
  --anomaly-width: 320px;
  --radius: 6px; --radius-lg: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --transition: 0.2s ease;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); font-size: 13px; line-height: 1.5; overflow: hidden; }
button { cursor: pointer; font-family: inherit; font-size: 12px; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-primary); padding: 6px 12px; border-radius: var(--radius); transition: var(--transition); }
button:hover { background: var(--border); border-color: var(--border-light); }
button.primary { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent); }
button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
button.danger { background: #da3633; border-color: #f85149; color: #fff; }
button.danger:hover { background: #f85149; }
button.sm { padding: 3px 8px; font-size: 11px; }
button.icon-btn { padding: 4px 8px; background: transparent; border: none; color: var(--text-secondary); font-size: 14px; }
button.icon-btn:hover { color: var(--text-primary); }
input, select, textarea { font-family: inherit; font-size: 12px; background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary); padding: 6px 10px; border-radius: var(--radius); outline: none; transition: var(--transition); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
select { appearance: auto; }
label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

/* ===== MULTI-SELECT ===== */                                                                                                                                    
  .multiselect { position: relative; display: inline-block; }                                                                                                       
  .multiselect-btn { background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary); padding: 5px 10px; border-radius: var(--radius);   
  cursor: pointer; min-width: 160px; text-align: left; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; transition:   
  var(--transition); }                                                                                                                                              
  .multiselect-btn:hover { border-color: var(--border-light); }                                                                                                     
  .multiselect-btn.has-selection { border-color: var(--accent); color: var(--accent); }                                                                             
  .multiselect-btn .chev { font-size: 9px; color: var(--text-muted); }                                                                                              
  .multiselect-panel { position: absolute; top: calc(100% + 4px); left: 0; background: var(--bg-secondary); border: 1px solid var(--border); border-radius:         
  var(--radius); box-shadow: var(--shadow); z-index: 500; min-width: 240px; max-height: 340px; display: flex; flex-direction: column; }                             
  .multiselect-panel.hidden { display: none; }                                                                                                                      
  .multiselect-search { padding: 6px; border-bottom: 1px solid var(--border); }                                                                                     
  .multiselect-search input { width: 100%; }                                                                                                                        
  .multiselect-actions { display: flex; gap: 4px; padding: 4px 6px; border-bottom: 1px solid var(--border); }                                                       
  .multiselect-actions button { flex: 1; padding: 2px 6px; font-size: 10px; }                                                                                       
  .multiselect-list { overflow-y: auto; flex: 1; padding: 4px 0; max-height: 220px; }                                                                               
  .multiselect-item { padding: 4px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 12px; user-select: none; }                       
  .multiselect-item:hover { background: var(--bg-tertiary); }                                                                                                       
  .multiselect-item input { margin: 0; cursor: pointer; }                                                                                                           
  .multiselect-item.hidden { display: none; }                                                                                                                       
  .multiselect-count { margin-left: auto; color: var(--text-muted); font-size: 10px; }

/* ===== GROUPS ===== */
.context-menu-item.group-action { color: #f0a500; }
.context-menu-item.group-action:hover { background: rgba(240,165,0,0.2); color: #f0a500; }
#group-modal { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9500;display:none;align-items:center;justify-content:center; }
#group-modal.active { display:flex; }
.group-content { background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:460px;width:90%; }
.group-content h3 { color:#f0a500;margin-bottom:4px; }
.group-member-tag { display:inline-flex;align-items:center;gap:4px;background:rgba(240,165,0,0.15);border:1px solid rgba(240,165,0,0.4);color:#f0a500;font-size:11px;padding:2px 8px;border-radius:10px;margin:3px; }
.group-member-tag .rm { cursor:pointer;opacity:0.7;font-size:13px; }
.group-member-tag .rm:hover { opacity:1; }
.group-node-badge { font-size:10px;color:#f0a500;background:rgba(240,165,0,0.12);border:1px solid rgba(240,165,0,0.35);border-radius:8px;padding:1px 6px;margin-left:4px; }
.group-sidebar-item { background:var(--bg-tertiary);border:1px solid var(--border);border-left:3px solid #f0a500;border-radius:var(--radius);padding:8px 10px;margin-bottom:6px;font-size:12px; }
.group-sidebar-item .gi-header { display:flex;align-items:center;justify-content:space-between;gap:6px; }
.group-sidebar-item .gi-name { font-weight:600;color:#f0a500;flex:1; }
.group-sidebar-item .gi-members { color:var(--text-muted);font-size:10px;margin-top:3px; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ===== LOADING OVERLAY ===== */
#loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(13,17,23,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
#loading-overlay.active { display: flex; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-text { color: var(--text-secondary); font-size: 14px; }

/* ===== WIZARD SCREENS ===== */
#wizard-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-primary); z-index: 9000; display: flex; align-items: center; justify-content: center; }
#wizard-overlay.hidden { display: none; }
.wizard-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; max-width: 800px; width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow); }
.wizard-card h2 { font-size: 20px; margin-bottom: 4px; color: var(--text-primary); }
.wizard-card .subtitle { color: var(--text-secondary); margin-bottom: 24px; font-size: 13px; }
.wizard-nav { display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end; }

/* File Upload Area */
.upload-area { border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: 60px 40px; text-align: center; transition: var(--transition); cursor: pointer; margin-bottom: 16px; }
.upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: rgba(88,166,255,0.05); }
.upload-area .upload-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.upload-area .upload-text { font-size: 16px; margin-bottom: 4px; }
.upload-area .upload-hint { color: var(--text-secondary); font-size: 12px; }
.upload-divider { text-align: center; color: var(--text-muted); margin: 16px 0; position: relative; }
.upload-divider::before, .upload-divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--border); }
.upload-divider::before { left: 0; }
.upload-divider::after { right: 0; }

/* Databricks Import */
.db-import-section { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.db-import-section h4 { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.db-import-row { display: flex; gap: 8px; margin-bottom: 8px; }
.db-import-row input { flex: 1; }

/* Sheet Selector */
.sheet-selector { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.sheet-btn { padding: 8px 16px; border-radius: var(--radius); cursor: pointer; }
.sheet-btn.active { background: var(--accent-dim); border-color: var(--accent); color: #fff; }

/* Data Preview Table */
.preview-table-wrap { overflow: auto; max-height: 400px; border: 1px solid var(--border); border-radius: var(--radius); margin: 16px 0; }
.preview-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.preview-table th, .preview-table td { padding: 6px 10px; border: 1px solid var(--border); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.preview-table th { background: var(--bg-tertiary); position: sticky; top: 0; font-weight: 600; }
.preview-table tr:nth-child(even) { background: rgba(255,255,255,0.02); }
.header-row-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }

/* Column Mapper */
.mapper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.mapper-item { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.mapper-item.required { border-left: 3px solid var(--accent); }
.mapper-item .mapper-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.mapper-item .mapper-label .req { color: var(--red); font-size: 10px; }
.mapper-item .mapper-label .opt { color: var(--text-muted); font-size: 10px; }
.mapper-item select { width: 100%; }
.auto-badge { display: inline-block; background: var(--accent-dim); color: var(--accent); font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }

/* ===== MAIN LAYOUT ===== */
#app-container { display: none; width: 100%; height: 100%; }
#app-container.active { display: flex; flex-direction: column; }

/* Top Bar */
#topbar { height: var(--topbar-height); background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; flex-shrink: 0; z-index: 100; }
.topbar-group { display: flex; align-items: center; gap: 4px; }
.topbar-divider { width: 1px; height: 24px; background: var(--border); margin: 0 8px; }
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.view-toggle button { border: none; border-radius: 0; border-right: 1px solid var(--border); padding: 4px 12px; }
.view-toggle button:last-child { border-right: none; }
.view-toggle button.active { background: var(--accent-dim); color: #fff; }
#topbar .spacer { flex: 1; }

/* Filter Bar */
#filter-bar { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 6px 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
#filter-bar label { margin-right: 2px; }
#filter-bar input, #filter-bar select { max-width: 140px; }
.filter-group { display: flex; align-items: center; gap: 4px; }

/* Main Content Area */
#main-content { display: flex; flex: 1; overflow: hidden; }

/* Left Sidebar */
#left-sidebar { width: var(--sidebar-width); background: var(--bg-secondary); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; transition: width var(--transition), padding var(--transition); }
#left-sidebar.collapsed { width: 0; padding: 0; overflow: hidden; }
.sidebar-section { border-bottom: 1px solid var(--border); }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }
.sidebar-header:hover { color: var(--text-primary); background: rgba(255,255,255,0.02); }
.sidebar-header .chevron { transition: transform var(--transition); font-size: 10px; }
.sidebar-header .chevron.collapsed { transform: rotate(-90deg); }
.sidebar-body { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.sidebar-body.collapsed { display: none; }
.sidebar-row { display: flex; align-items: center; gap: 8px; }
.sidebar-row label { min-width: 60px; }
.sidebar-row select, .sidebar-row input { flex: 1; min-width: 0; }
.color-input { width: 32px; height: 24px; padding: 0; border: 1px solid var(--border); cursor: pointer; }

/* Canvas / Graph Area */
#canvas-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

/* Timeline Panel */
#timeline-panel .panel-close { position: absolute; top: 4px; right: 8px; z-index: 10; }
#timeline-container { width: 100%; height: 100%; }

/* Graph Container(s) */
#graph-area { flex: 1; display: flex; position: relative; }
.cy-container { flex: 1; position: relative; }
.cy-canvas { width: 100%; height: 100%; }
.cy-close { position: absolute; top: 8px; right: 8px; z-index: 10; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); font-size: 14px; }
.cy-close:hover { color: var(--red); background: var(--bg-secondary); }
.graph-divider { width: 2px; background: var(--border); flex-shrink: 0; }

/* Right Sidebar (Anomaly Panel) */
#right-sidebar { width: var(--anomaly-width); background: var(--bg-secondary); border-left: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; transition: width var(--transition); display: none; }
#right-sidebar.active { display: block; }
#right-sidebar.collapsed { width: 0; overflow: hidden; }
.anomaly-card { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin: 8px; cursor: pointer; transition: var(--transition); }
.anomaly-card:hover { border-color: var(--accent); }
.anomaly-card .anomaly-type { font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
.anomaly-card .anomaly-type.circular { color: var(--red); }
.anomaly-card .anomaly-type.rapid { color: var(--orange); }
.anomaly-card .anomaly-type.roundtrip { color: var(--purple); }
.anomaly-card .anomaly-type.timing { color: var(--yellow); }
.anomaly-card .anomaly-type.concentration { color: var(--pink); }
.anomaly-card .anomaly-desc { font-size: 12px; color: var(--text-secondary); }
.anomaly-section-title { padding: 12px 12px 4px; font-weight: 600; font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }

/* Detail Side Panel (edge/node click) */
#detail-panel { position: absolute; top: 0; right: 0; width: 320px; height: 100%; background: var(--bg-secondary); border-left: 1px solid var(--border); z-index: 50; overflow-y: auto; display: none; box-shadow: -4px 0 12px rgba(0,0,0,0.3); }
#detail-panel.active { display: block; }
#detail-panel .detail-header { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
#detail-panel .detail-body { padding: 12px; }
.detail-stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.detail-stat .stat-label { color: var(--text-secondary); }
.detail-stat .stat-value { font-weight: 600; }
.detail-txn-list { margin-top: 12px; }
.detail-txn-item { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; margin-bottom: 6px; font-size: 11px; }

/* Context Menu */
.context-menu { position: fixed; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 10000; min-width: 180px; padding: 4px 0; }
.context-menu-item { padding: 6px 12px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; }
.context-menu-item:hover { background: var(--accent-dim); color: #fff; }
.context-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
.shift-selected-label { position:fixed; background:#f0a500; color:#000; font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px; pointer-events:none; z-index:300; transform:translate(-50%,-110%); }

/* Tooltip */
.graph-tooltip { position: absolute; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 11px; pointer-events: none; z-index: 200; max-width: 300px; box-shadow: var(--shadow); }
.graph-tooltip .tt-title { font-weight: 600; margin-bottom: 4px; }
.graph-tooltip .tt-row { color: var(--text-secondary); }

/* Summary Modal */
#summary-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 9500; display: none; align-items: center; justify-content: center; }
#summary-modal.active { display: flex; }
.summary-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
.summary-content h3 { margin-bottom: 16px; }
.summary-text { font-size: 13px; line-height: 1.7; color: var(--text-secondary); white-space: pre-wrap; }

/* Export Modal */
#export-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 9500; display: none; align-items: center; justify-content: center; }
#export-modal.active { display: flex; }
.export-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; max-width: 500px; width: 90%; }
.export-content h3 { margin-bottom: 16px; }
.export-field { margin-bottom: 12px; }
.export-field label { display: block; margin-bottom: 4px; }
.export-field input, .export-field textarea { width: 100%; }

/* Shortest Path Modal */
#path-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 9500; display: none; align-items: center; justify-content: center; }
#path-modal.active { display: flex; }
.path-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; max-width: 400px; width: 90%; }

#rename-modal { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9500;display:none;align-items:center;justify-content:center; }
#rename-modal.active { display:flex; }
.rename-content { background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:440px;width:90%; }

/* Annotations */
.annotation-box {
  position: absolute;
  z-index: 100;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 8px 10px;
  min-width: 80px;
  min-height: 30px;
  cursor: move;
  user-select: none;
  font-size: 12px;
  color: var(--text-primary);
  word-wrap: break-word;
  backdrop-filter: blur(4px);
  resize: both;
  overflow: auto;
}
.annotation-box:hover { border-color: var(--accent); }
.annotation-box:hover .annotation-controls { display: flex; }
.annotation-controls {
  display: none;
  position: absolute;
  bottom: calc(100% + 4px);
  left: 0;
  gap: 2px;
  flex-wrap: wrap;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px 4px;
  min-width: 100%;
}
.annotation-box::before {
  content: '';
  position: absolute;
  bottom: 100%;
  left: 0;
  right: 0;
  height: 8px;
  display: none;
}
.annotation-box:hover::before { display: block; }
.annotation-controls button {
  width: 22px; height: 22px; padding: 0; font-size: 10px;
  border-radius: 3px; display: flex; align-items: center; justify-content: center;
  background: var(--bg-tertiary); border: 1px solid var(--border);
  color: var(--text-secondary); cursor: pointer;
}
.annotation-controls button:hover { color: var(--text-primary); border-color: var(--accent); background: var(--accent-dim); }
.annotation-controls button.active { background: var(--accent-dim); color: #fff; border-color: var(--accent); }
.annotation-controls .ctrl-divider { width: 1px; height: 18px; background: var(--border); margin: 2px 2px; }
.annotation-text { outline: none; white-space: pre-wrap; line-height: 1.5; min-height: 20px; }
.annotation-text:empty::before { content: 'Type here...'; color: var(--text-muted); }
.annotation-img { max-width: 100%; border-radius: 3px; margin-top: 4px; display: block; cursor: default; }

/* ===== SWIMLANE TIMELINE ===== */
#timeline-container { display:flex; flex-direction:column; flex:1; min-height:0; }

#timeline-panel { position:relative; flex:0 0 360px; min-height:140px; background:var(--bg-primary); border-bottom:1px solid var(--border); overflow:hidden; display:none; flex-direction:column; }
#timeline-panel.active { display:flex; }
#timeline-panel .panel-close { position:absolute; top:6px; right:10px; z-index:60; }
.tl-resizer { height:6px; flex-shrink:0; cursor:row-resize; background:var(--bg-secondary); border-top:1px solid var(--border); }
.tl-resizer:hover { background:var(--accent-dim); }

.tl-controls { display:flex; align-items:center; gap:8px; padding:0 34px 0 12px; height:40px; border-bottom:1px solid var(--border); background:var(--bg-secondary); flex-shrink:0; overflow-x:auto; }
.tl-controls select, .tl-controls button { font-size:10px; flex-shrink:0; }
.tl-controls .tl-step { font-size:10px; color:var(--text-secondary); margin-left:auto; white-space:nowrap; }
.tl-zoom { display:flex; align-items:center; gap:2px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.tl-zoom button { border:none; border-radius:0; padding:3px 8px; }

function getRadialFromEntity(entityId, cy) {
  const depthMap = new Map();
  let depth = 0, frontier = [entityId];
  const visited = new Set([entityId]);
  depthMap.set(entityId, 0);
  while (frontier.length > 0) {
    depth++;
    const next = [];
    frontier.forEach(nid => {
      cy.getElementById(nid).neighborhood('node').forEach(nb => {
        if (!visited.has(nb.id())) {
          visited.add(nb.id()); depthMap.set(nb.id(), depth); next.push(nb.id());
        }
      });
    });
    frontier = next;
  }
  cy.nodes().forEach(n => { if (!depthMap.has(n.id())) depthMap.set(n.id(), depth + 1); });
  const maxD = Math.max(...depthMap.values()) || 1;
  return {
    name: 'concentric', animate: false, nodeDimensionsIncludeLabels: true,
    concentric: (node) => maxD - (depthMap.get(node.id()) || maxD),
    levelWidth: () => 1, minNodeSpacing: 50, padding: 40,
    startAngle: Math.PI * 1.5, clockwise: true,
  };
}

function getHierarchyFromEntity(entityId, cy) {
  const depthMap = new Map();
  let maxDepth = 0, frontier = [entityId];
  const visited = new Set([entityId]);
  depthMap.set(entityId, 0);
  while (frontier.length > 0) {
    const next = [];
    frontier.forEach(nid => {
      const d = depthMap.get(nid);
      cy.getElementById(nid).neighborhood('node').forEach(nb => {
        if (!visited.has(nb.id())) {
          visited.add(nb.id());
          const nd = d + 1;
          depthMap.set(nb.id(), nd);
          if (nd > maxDepth) maxDepth = nd;
          next.push(nb.id());
        }
      });
    });
    frontier = next;
  }
  cy.nodes().forEach(n => {
    if (!depthMap.has(n.id())) depthMap.set(n.id(), maxDepth + 1);
  });
  const levels = new Map();
  depthMap.forEach((d, id) => {
    if (!levels.has(d)) levels.set(d, []);
    levels.get(d).push(id);
  });
  const positions = {};
  const levelGap = 160;
  const nodeGap = 120;
  levels.forEach((nodeIds, level) => {
    const totalWidth = (nodeIds.length - 1) * nodeGap;
    nodeIds.forEach((id, i) => {
      positions[id] = {
        x: -totalWidth / 2 + i * nodeGap,
        y: level * levelGap
      };
    });
  });
  return {
    name: 'preset',
    positions: (node) => positions[node.id()] || { x: 0, y: (maxDepth + 2) * levelGap },
    animate: false,
    fit: true,
    padding: 50
  };
}

function getTimelineLayout(txns, cy) {
  // Compute earliest date per entity
  const entityDates = new Map();
  txns.forEach(t => {
    if (!t.date) return;
    const ts = t.date.getTime();
    [t.from, t.to].forEach(ent => {
      if (!entityDates.has(ent) || ts < entityDates.get(ent)) {
        entityDates.set(ent, ts);
      }
    });
  });

  // Entities without dates go to the end
  const maxTs = Math.max(...entityDates.values()) || 0;
  cy.nodes().forEach(n => {
    if (!entityDates.has(n.id())) entityDates.set(n.id(), maxTs + 86400000);
  });

  const minTs = Math.min(...entityDates.values());
  const range = maxTs - minTs || 86400000;

  // Sort entities by date, then assign rows to avoid overlap
  const sorted = Array.from(entityDates.entries()).sort((a, b) => a[1] - b[1]);

  // Group entities that share the same date bucket (same day)
  const dayBuckets = new Map();
  sorted.forEach(([ent, ts]) => {
    const dayKey = Math.floor((ts - minTs) / 86400000);
    if (!dayBuckets.has(dayKey)) dayBuckets.set(dayKey, []);
    dayBuckets.get(dayKey).push(ent);
  });

  const positions = {};
  const xPadding = 100;
  const yGap = 100;
  const totalWidth = Math.max(cy.width() - 2 * xPadding, 800);

  dayBuckets.forEach((entities, dayKey) => {
    const t = range > 0 ? (dayKey * 86400000) / range : 0.5;
    const x = xPadding + t * totalWidth;
    const groupHeight = (entities.length - 1) * yGap;
    entities.forEach((ent, i) => {
      positions[ent] = {
        x: x,
        y: -groupHeight / 2 + i * yGap
      };
    });
  });

  return {
    name: 'preset',
    positions: (node) => positions[node.id()] || { x: totalWidth / 2, y: 0 },
    animate: false,
    fit: true,
    padding: 60
  };
}

function $(sel, ctx) { return (ctx || document).querySelector(sel); }

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'className') e.className = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else if (k === 'textContent') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  if (children) {
    if (typeof children === 'string') e.textContent = children;
    else if (Array.isArray(children)) children.forEach(c => { if (c) e.appendChild(c); });
    else e.appendChild(children);
  }
  return e;
}
function formatAmount(val) {
  if (val == null || isNaN(val)) return '—';
  if (STATE.roundNumbers) return '$' + Math.round(val).toLocaleString();
  return '$' + val.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function parseAmount(str) {
  if (str == null) return null;
  if (typeof str === 'number') return str;
  let s = String(str).trim();
  let neg = false;
  if (s.startsWith('(') && s.endsWith(')')) { neg = true; s = s.slice(1, -1); }
  if (s.startsWith('-')) { neg = true; s = s.slice(1); }
  s = s.replace(/[$,\s]/g, '');
  const val = parseFloat(s);
  if (isNaN(val)) return null;
  return neg ? -val : val;
}
function parseDate(str) {
  if (!str) return null;
  if (str instanceof Date) return isNaN(str.getTime()) ? null : str;
  if (typeof str === 'number') {
    // Excel serial date
    if (str > 25569 && str < 99999) {
      const d = new Date((str - 25569) * 86400000);
      return isNaN(d.getTime()) ? null : d;
    }
    return null;
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

   ========================================================================== */
function handleFile(file) {
  if (!file) return;
  STATE.fileName = file.name;
  showLoading('Reading file...');
  const reader = new FileReader();
  const isCSV = file.name.toLowerCase().endsWith('.csv');
  reader.onload = function(e) {
    try {
      if (isCSV) {
        const text = e.target.result;
        const wb = XLSX.read(text, {type: 'string'});
        STATE.workbook = wb;
        STATE.sheetNames = wb.SheetNames;
        STATE.selectedSheet = 0;
        hideLoading();
        if (wb.SheetNames.length > 1) {
          showSheetSelectStep();
        } else {
          showPreviewStep();
        }
      } else {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type: 'array', cellDates: true});
        STATE.workbook = wb;
        STATE.sheetNames = wb.SheetNames;
        STATE.selectedSheet = 0;
        hideLoading();
        if (wb.SheetNames.length > 1) {
          showSheetSelectStep();
        } else {
          showPreviewStep();
        }
      }
    } catch (err) {
      hideLoading();
      alert('Error reading file: ' + err.message);
    }
  };
  if (isCSV) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

async function handleDatabricksImport() {
  const catalog = $('#db-catalog').value.trim();
  const schema  = $('#db-schema').value.trim();
  const table   = $('#db-table').value.trim();
  const limit   = parseInt($('#db-limit')?.value || '10000');
  const filter  = $('#db-filter')?.value.trim() || '';

  if (!catalog || !schema || !table) {
    alert('Please fill in Catalog, Schema, and Table.');
    return;
  }

  showLoading('Querying Databricks…');

  try {
    const params = new URLSearchParams({ catalog, schema, table, limit });
    if (filter) params.set('filter', filter);

    const resp = await fetch(`/api/data?${params}`);
    const json = await resp.json();

    if (!resp.ok) {
      const msg = json.error || `HTTP ${resp.status}`;
      const detail = json.detail ? '\n\n' + json.detail.slice(0, 600) : '';
      hideLoading();
      alert('Databricks import failed:\n' + msg + detail);
      return;
    }

    if (!json.rows || json.rows.length === 0) {
      hideLoading();
      alert('No data returned. Check your table name or filter.');
      return;
    }

    STATE.rawData = json.rows;
    STATE.headers = Object.keys(json.rows[0]);
    STATE.fileName = `${catalog}.${schema}.${table}`;

    hideLoading();
    STATE.wizardStep = 'mapper';
    showMapperStep();

  } catch (err) {
    hideLoading();
    alert('Databricks import failed: ' + err.message);
    console.error(err);
  }
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function extractData() {
  const ws = STATE.workbook.Sheets[STATE.sheetNames[STATE.selectedSheet]];
  const jsonAll = XLSX.utils.sheet_to_json(ws, {header: 1, defval: '', raw: false});
  const headers = (jsonAll[STATE.headerRow] || []).map(h => String(h).trim());
  STATE.headers = headers;
  STATE.rawData = [];
  for (let i = STATE.headerRow + 1; i < jsonAll.length; i++) {
    const row = jsonAll[i];
    if (!row || row.every(c => c === '' || c == null)) continue;
    const obj = {};
    headers.forEach((h, ci) => { obj[h] = row[ci] ?? ''; });
    STATE.rawData.push(obj);
  }
}

function processData() {
  showLoading('Processing transactions...');
  const m = STATE.mapping;
  STATE.transactions = [];
  STATE.entities = new Map();
  STATE.entityPairs = new Map();

  STATE.rawData.forEach((row, idx) => {                                                                                                                             
    const amount = m.amount ? parseAmount(row[m.amount]) : null;                                                                                                    
    let from, to;                                                                                                                                                   
    if (STATE.dataShape === 'entity') {                                                                                                                             
      const entity = String(row[m.entity] || '').trim();                                                                                                            
      const counterparty = String(row[m.counterparty] || '').trim();                                                                                                
      if (!entity && !counterparty) return;                                                                                                                         
      if (amount != null && amount < 0) { from = entity; to = counterparty; }                                                                                       
      else                              { from = counterparty; to = entity; }                                                                                       
    } else {                                                                                                                                                        
      from = String(row[m.from] || '').trim();                                                                                                                      
      to = String(row[m.to] || '').trim();                                                                                                                          
      if (!from && !to) return;                                                                                                                                     
    }                                                                                                                                                               
    const txn = {                                                                                                                                                   
      id: idx,                                                                                                                                                      
      from: from || 'Unknown',                                                                                                                                      
      to: to || 'Unknown',                                                                                                                                          
      amount: amount,
      date: m.date ? parseDate(row[m.date]) : null,
      time: m.time ? String(row[m.time] || '') : '',
      desc: m.desc ? String(row[m.desc] || '') : '',
      type: m.type ? String(row[m.type] || '') : '',
    };
    STATE.transactions.push(txn);

    // Entity stats
    [txn.from, txn.to].forEach(ent => {
      if (!STATE.entities.has(ent)) {
        STATE.entities.set(ent, {name: ent, txnCount: 0, totalIn: 0, totalOut: 0, connections: new Set()});
      }
    });
    const fe = STATE.entities.get(txn.from);
    const te = STATE.entities.get(txn.to);
    fe.txnCount++; te.txnCount++;
    if (txn.amount != null) { fe.totalOut += Math.abs(txn.amount); te.totalIn += Math.abs(txn.amount); }
    fe.connections.add(txn.to);
    te.connections.add(txn.from);

    // Pair stats
    const pairKey = `${txn.from}->${txn.to}`;
    if (!STATE.entityPairs.has(pairKey)) {
      STATE.entityPairs.set(pairKey, {from: txn.from, to: txn.to, count: 0, total: 0, txns: []});
    }
    const pair = STATE.entityPairs.get(pairKey);
    pair.count++;
    if (txn.amount != null) pair.total += Math.abs(txn.amount);
    pair.txns.push(txn);
  });

  // Filter computations
  const dates = STATE.transactions.map(t => t.date).filter(Boolean);
  if (dates.length) {
    STATE.filters.dateMin = new Date(Math.min(...dates.map(d => d.getTime())));
    STATE.filters.dateMax = new Date(Math.max(...dates.map(d => d.getTime())));
  }
  const amounts = STATE.transactions.map(t => t.amount).filter(a => a != null);
  if (amounts.length) {
    STATE.filters.amountMin = Math.min(...amounts);
    STATE.filters.amountMax = Math.max(...amounts);
  }

  runAnomalyDetection();
  hideLoading();
}



/* ==========================================================================
   ANOMALY DETECTION
   ========================================================================== */
// NEW
function runAnomalyDetection(txns) {
  txns = txns || STATE.transactions;
  STATE.anomalies = [];
  // rebuild entity map from filtered txns for accurate detection
  const entities = new Map();
  txns.forEach(t => {
    [t.from, t.to].forEach(ent => {
      if (!entities.has(ent)) entities.set(ent, {name: ent, txnCount: 0, totalIn: 0, totalOut: 0});
    });
    const fe = entities.get(t.from);
    const te = entities.get(t.to);
    fe.txnCount++; te.txnCount++;
    if (t.amount != null) { fe.totalOut += Math.abs(t.amount); te.totalIn += Math.abs(t.amount); }
  });
  // rebuild pair map from filtered txns
  const entityPairs = new Map();
  txns.forEach(t => {
    const key = `${t.from}->${t.to}`;
    if (!entityPairs.has(key)) entityPairs.set(key, {from: t.from, to: t.to, count: 0, total: 0, txns: []});
    const p = entityPairs.get(key);
    p.count++; if (t.amount != null) p.total += Math.abs(t.amount); p.txns.push(t);
  });

  // 1. Circular flows: A->B and B->A
  const pairSet = new Set();
  entityPairs.forEach((v, k) => pairSet.add(k));
  const checkedCircular = new Set();
  entityPairs.forEach((pair) => {
    const rev = `${pair.to}->${pair.from}`;
    const key = [pair.from, pair.to].sort().join('||');
    if (pairSet.has(rev) && !checkedCircular.has(key)) {
      checkedCircular.add(key);
      const revPair = entityPairs.get(rev);
      STATE.anomalies.push({
        type: 'circular', severity: 'high',
        entities: [pair.from, pair.to],
        desc: `Circular flow between ${pair.from} and ${pair.to}: ${pair.count} txns out (${formatAmount(pair.total)}), ${revPair.count} txns back (${formatAmount(revPair.total)}).`
      });
    }
  });

  // 2. Rapid cycling: receive and send similar amounts within 48 hours
  if (STATE.mapping.date && STATE.mapping.amount) {
    const byEntity = new Map();
    txns.forEach(t => {
      if (!t.date || t.amount == null) return;
      if (!byEntity.has(t.to)) byEntity.set(t.to, []);
      byEntity.get(t.to).push({...t, role: 'in'});
      if (!byEntity.has(t.from)) byEntity.set(t.from, []);
      byEntity.get(t.from).push({...t, role: 'out'});
    });
    byEntity.forEach((etxns, ent) => {
      const ins = etxns.filter(t => t.role === 'in').sort((a,b) => a.date - b.date);
      const outs = etxns.filter(t => t.role === 'out').sort((a,b) => a.date - b.date);
      ins.forEach(inTxn => {
        outs.forEach(outTxn => {
          if (outTxn.date > inTxn.date && (outTxn.date - inTxn.date) < 48*3600*1000) {
            const ratio = Math.min(Math.abs(inTxn.amount), Math.abs(outTxn.amount)) / Math.max(Math.abs(inTxn.amount), Math.abs(outTxn.amount));
            if (ratio > 0.8) {
              const exists = STATE.anomalies.find(a => a.type === 'rapid' && a.entities.includes(ent));
              if (!exists) {
                STATE.anomalies.push({
                  type: 'rapid', severity: 'medium',
                  entities: [ent, inTxn.from, outTxn.to],
                  desc: `Rapid cycling at ${ent}: received ${formatAmount(Math.abs(inTxn.amount))} from ${inTxn.from}, sent ${formatAmount(Math.abs(outTxn.amount))} to ${outTxn.to} within 48 hours.`
                });
              }
            }
          }
        });
      });
    });
  }

  // 3. Round-trip detection: A->...->A via any number of intermediaries
  // Build adjacency map from filtered pair map
  const adjMap = new Map();
  entityPairs.forEach((pair) => {
    if (!adjMap.has(pair.from)) adjMap.set(pair.from, new Set());
    adjMap.get(pair.from).add(pair.to);
  });

  // For each entity, BFS to find if any path leads back to it
  // Skip direct A->B->A (already caught as circular)
  const reportedRoundtrips = new Set();

  entities.forEach((eData, startEnt) => {
    // BFS: find all paths from startEnt back to startEnt with 2+ hops
    const queue = [{ node: startEnt, path: [startEnt], visited: new Set([startEnt]) }];

    while (queue.length > 0) {
      const { node, path, visited } = queue.shift();

      const neighbors = adjMap.get(node) || new Set();
      neighbors.forEach(next => {
        // Found a cycle back to start
        if (next === startEnt && path.length >= 2) {
          const hopCount = path.length - 1; // number of hops excluding return

          // Skip 1-hop cycles (A->B->A) — already handled by circular flow
          if (hopCount === 1) return;

          // Deduplicate: normalize the path to a canonical key
          // (rotate so smallest entity name is first, to avoid A->B->C and B->C->A being reported twice)
          const cyclePath = [...path]; // e.g. [A, B, C] meaning A->B->C->A
          let minIdx = 0;
          cyclePath.forEach((e, i) => { if (e < cyclePath[minIdx]) minIdx = i; });
          const normalized = [...cyclePath.slice(minIdx), ...cyclePath.slice(0, minIdx)];
          const cycleKey = normalized.join('->');

          if (!reportedRoundtrips.has(cycleKey)) {
            reportedRoundtrips.add(cycleKey);
            const fullPath = [...path, startEnt]; // show the return
            STATE.anomalies.push({
              type: 'roundtrip', severity: 'high',
              entities: path, // all nodes in the cycle for highlighting
              desc: `Round-trip (${hopCount} hops): ${fullPath.join(' → ')}. Money leaves ${startEnt} and returns through ${hopCount - 1} intermediar${hopCount - 1 === 1 ? 'y' : 'ies'}.`
            });
          }
          return; // don't continue extending this path past the start
        }

        // Don't revisit nodes already in this path (prevent infinite loops)
        if (visited.has(next)) return;

        // Cap path length to avoid exponential blowup on large graphs
        if (path.length >= 6) return; // max 5-hop cycles (A->B->C->D->E->F->A)

        queue.push({
          node: next,
          path: [...path, next],
          visited: new Set([...visited, next])
        });
      });
    }
  });

  // 4. Timing clusters
  if (STATE.mapping.date) {
    const byDate = new Map();
    txns.forEach(t => {
      if (!t.date) return;
      const dk = t.date.toISOString().slice(0, 10);
      byDate.set(dk, (byDate.get(dk) || 0) + 1);
    });
    const counts = Array.from(byDate.values());
    const avg = counts.reduce((a,b) => a+b, 0) / (counts.length || 1);
    const std = Math.sqrt(counts.reduce((s, c) => s + (c - avg) ** 2, 0) / (counts.length || 1));
    byDate.forEach((count, date) => {
      if (count > avg + 2 * std && count >= 5) {
        STATE.anomalies.push({
          type: 'timing', severity: 'medium',
          entities: [], date: date,
          desc: `Timing cluster on ${date}: ${count} transactions (average is ${Math.round(avg)}/day).`
        });
      }
    });
  }

  // 5. High concentration
  entities.forEach((eData, ent) => {
    if (eData.txnCount < 5) return;
    const connCounts = new Map();
    txns.forEach(t => {
      if (t.from === ent) connCounts.set(t.to, (connCounts.get(t.to) || 0) + 1);
      if (t.to === ent) connCounts.set(t.from, (connCounts.get(t.from) || 0) + 1);
    });
    connCounts.forEach((cnt, partner) => {
      if (cnt / eData.txnCount >= 0.8) {
        const exists = STATE.anomalies.find(a => a.type === 'concentration' && a.entities.includes(ent) && a.entities.includes(partner));
        if (!exists) {
          STATE.anomalies.push({
            type: 'concentration', severity: 'low',
            entities: [ent, partner],
            desc: `High concentration: ${Math.round(cnt/eData.txnCount*100)}% of ${ent}'s ${eData.txnCount} transactions are with ${partner}.`
          });
        }
      }
    });
  });

  // Sort by severity
  const sevOrder = {high: 0, medium: 1, low: 2};
  STATE.anomalies.sort((a, b) => sevOrder[a.severity] - sevOrder[b.severity]);
}

      opt.addEventListener('mouseleave', () => opt.style.background = '');

function buildEntityFilter() {                                                                                                                                    
    const container = $('#entity-filter');

    container.innerHTML = '';

    const chev = el('span', {className: 'chev', innerHTML: '&#9660;'});                                                                                             
    btn.appendChild(btnLabel); btn.appendChild(chev);                                                                                                               
                                                                                                                                                                    
    const panel = el('div', {className: 'multiselect-panel hidden'});                                                                                               
    const searchWrap = el('div', {className: 'multiselect-search'});                                                                                                
    const searchInp = el('input', {type: 'text', placeholder: 'Filter entities...'});                                                                               
    searchWrap.appendChild(searchInp);                                                                                                                              
                                                                                                                                                                    
    const actions = el('div', {className: 'multiselect-actions'});                                                                                                  
    const selectVisible = el('button', {type: 'button', textContent: 'Select visible'});                                                                            
    const clearAll = el('button', {type: 'button', textContent: 'Clear'});                                                                                          
    actions.appendChild(selectVisible); actions.appendChild(clearAll);                                                                                              
                                                                                                                                                                    
    const list = el('div', {className: 'multiselect-list'});                                                                                                        
    const items = [];                                                                                                                                               
    entities.forEach(name => {                                                                                                                                      
      const eData = STATE.entities.get(name);                                                                                                                       
      const item = el('label', {className: 'multiselect-item'});                                                                                                    
      const cb = el('input', {type: 'checkbox', value: name});                                                                                                      
      cb.checked = STATE.filters.entities.includes(name);                                                                                                           
      const lbl = el('span', {textContent: name});                                                                                                                  
      const cnt = el('span', {className: 'multiselect-count', textContent: eData ? String(eData.txnCount) : ''});                                                   
      item.appendChild(cb); item.appendChild(lbl); item.appendChild(cnt);                                                                                           
      cb.addEventListener('change', updateSelection);                                                                                                               
      list.appendChild(item);                                                                                                                                       
      items.push({el: item, name, cb});                                                                                                                             
    });                                                                                                                                                             
                                                                                                                                                                    
    panel.appendChild(searchWrap);                                                                                                                                  
    panel.appendChild(actions);                                                                                                                                   
    panel.appendChild(list);                                                                                                                                        
    container.appendChild(btn);                                                                                                                                     
    container.appendChild(panel);                                                                                                                                   
                                                                                                                                                                    
    function updateSelection() {                                                                                                                                    
      const sel = items.filter(i => i.cb.checked).map(i => i.name);                                                                                                 
      STATE.filters.entities = sel;                                                                                                                                 
      if (sel.length === 0) { btnLabel.textContent = 'All entities'; btn.classList.remove('has-selection'); }                                                       
      else if (sel.length === 1) { btnLabel.textContent = sel[0]; btn.classList.add('has-selection'); }                                                             
      else { btnLabel.textContent = `${sel.length} entities`; btn.classList.add('has-selection'); }                                                                 
      renderGraphs();                                                                                                                                               
    }                                                                                                                                                               
                                                                                                                                                                    
    searchInp.addEventListener('input', () => {                                                                                                                     
      const q = searchInp.value.toLowerCase();                                                                                                                    
      items.forEach(i => i.el.classList.toggle('hidden', q && !i.name.toLowerCase().includes(q)));                                                                  
    });                                                                                                                                                             
                                                                                                                                                                    
    selectVisible.addEventListener('click', e => {                                                                                                                  
      e.stopPropagation();                                                                                                                                          
      items.forEach(i => { if (!i.el.classList.contains('hidden')) i.cb.checked = true; });                                                                         
      updateSelection();                                                                                                                                            
    });                                                                                                                                                             
                                                                                                                                                                    
    clearAll.addEventListener('click', e => {                                                                                                                       
      e.stopPropagation();                                                                                                                                        
      items.forEach(i => { i.cb.checked = false; });                                                                                                                
      searchInp.value = '';                                                                                                                                         
      items.forEach(i => i.el.classList.remove('hidden'));                                                                                                          
      updateSelection();                                                                                                                                            
    });                                                                                                                                                             
                                                                                                                                                                    
    btn.addEventListener('click', e => {                                                                                                                            
      e.stopPropagation();                                                                                                                                        
      panel.classList.toggle('hidden');                                                                                                                             
      if (!panel.classList.contains('hidden')) searchInp.focus();                                                                                                   
    });                                                                                                                                                             
                                                                                                                                                                    
    panel.addEventListener('click', e => e.stopPropagation());                                                                                                      
    document.addEventListener('click', e => {                                                                                                                     
      if (!container.contains(e.target)) panel.classList.add('hidden');                                                                                             
    });                                                                                                                                                             
  }

function highlightAnomaly(anomaly) {
  const cy = getActiveCy();
  if (!cy) return;

  cy.elements().removeClass('anomaly-highlight dimmed highlighted');

  const entIds = anomaly.entities.filter(Boolean);
  if (entIds.length === 0) return;

  cy.elements().addClass('dimmed');

  const entSet = new Set(entIds);
  entIds.forEach(ent => {
    const node = cy.getElementById(ent);
    if (!node.length) return;
    node.removeClass('dimmed').addClass('anomaly-highlight');

    node.connectedEdges().forEach(edge => {
      const src = edge.data('source');
      const tgt = edge.data('target');
      if (entSet.has(src) && entSet.has(tgt)) {
        edge.removeClass('dimmed').addClass('anomaly-highlight');
      }
    });
  });
}

/* ==========================================================================

function getFilteredTransactions() {                                                                                                                              
    return STATE.transactions.filter(t => {                                                                                                                         
      if (STATE.filters.entities && STATE.filters.entities.length > 0) {            
    if (STATE.filters.entities.length === 1) {                                  
      if (!STATE.filters.entities.includes(t.from) &&                           
  !STATE.filters.entities.includes(t.to)) return false;                         
    } else {                                                                    
      if (!STATE.filters.entities.includes(t.from) ||                           
  !STATE.filters.entities.includes(t.to)) return false;                         
    }                                                                           
  }                                                                                                                                                             
      if (STATE.filters.dateMin && t.date && t.date < STATE.filters.dateMin) return false;                                                                          
      if (STATE.filters.dateMax && t.date && t.date > STATE.filters.dateMax) return false;                                                                          
      if (STATE.filters.amountMin != null && t.amount != null && Math.abs(t.amount) < STATE.filters.amountMin) return false;                                        
      if (STATE.filters.amountMax != null && t.amount != null && Math.abs(t.amount) > STATE.filters.amountMax) return false;                                        
      if (STATE.filters.type && t.type !== STATE.filters.type) return false;                                                                                        
      if (STATE.mainEntity && STATE.filters.direction) {
  if (STATE.filters.direction === 'in' && t.to !== STATE.mainEntity) return false;
  if (STATE.filters.direction === 'out' && t.from !== STATE.mainEntity) return false;
}                                                                                                                                                             
      return true;                                                                                                                                                  
    });                                                                                                                                                             
  }

function buildGraphElements(txns, mode) {                                                                                                                         
    const nodes = new Map();                                                                                                                                        
    const edges = [];                                                                                                                                               
    const baseNodeSize = typeof STATE.nodeSize === 'number' ? STATE.nodeSize : 45;                                                                                  
    const arrowScale = typeof STATE.arrowSize === 'number' ? STATE.arrowSize : 2;                                                                                   
                                                                                                                                                                    
    txns.forEach(t => {                                                                                                                                             
      [t.from, t.to].forEach(ent => {                                                                                                                               
        if (!nodes.has(ent)) {                                                                                                                                      
          const eData = STATE.entities.get(ent) || {txnCount: 1, totalIn: 0, totalOut: 0};                                                                          
          let sz = baseNodeSize;                                                                                                                                    
          if (STATE.nodeSize === 'scaled') {                                                                                                                        
            sz = 45;                                                                                                                                                
          }                                                                                                                                                         
          nodes.set(ent, {
            data: {
              id: ent, label: displayName(ent), size: sz,
              txnCount: eData.txnCount,
              totalIn: eData.totalIn, totalOut: eData.totalOut,
              hasIcon: !!STATE.nodeIcons[ent],
              iconUrl: STATE.nodeIcons[ent] || '',
              shape: STATE.nodeShapes[ent] || STATE.nodeShape,
                            hasCustomColor: !!STATE.nodeColors[ent],
              customColor: STATE.nodeColors[ent] || '',
              hlColor: '#f0e68c'
            }
          });                                                                                                                                                       
        }                                                                                                                                                           
      });                                                                                                                                                           
      if (mode === 'detail') {                                                                                                                                      
        let color = STATE.edgeColor;                                                                                                                                
        if (STATE.useDirectionColors && STATE.mainEntity) {                                                                                                         
          if (t.to === STATE.mainEntity) color = STATE.inColor;                                                                                                     
          else if (t.from === STATE.mainEntity) color = STATE.outColor;                                                                                             
        }                                                                                                                                                           
        edges.push({                                                                                                                                                
          data: {                                                                                                                                                   
            id: `e${t.id}`, source: t.from, target: t.to,                                                                                                         
            label: t.amount != null ? formatAmount(Math.abs(t.amount)) : '',                                                                                        
            amount: t.amount, date: t.date ? t.date.toLocaleDateString() : '',                                                                                      
            desc: t.desc, type: t.type,                                                                                                                             
            thickness: STATE.edgeThicknessScale ? 2 : STATE.uniformEdgeWidth,                                                                                       
            color, txnId: t.id, arrowScale: arrowScale                                                                                                              
          }                                                                                                                                                         
        });                                                                                                                                                         
      }                                                                                                                                                             
    });                                                                                                                                                             
   
    if (mode === 'summary') {                                                                                                                                       
      const pairs = new Map();                                                                                                                                    
      txns.forEach(t => {                                                                                                                                           
        const key = `${t.from}->${t.to}`;                                                                                                                           
        if (!pairs.has(key)) pairs.set(key, {from: t.from, to: t.to, count: 0, total: 0, txns: []});                                                                
        const p = pairs.get(key);                                                                                                                                   
        p.count++;                                                                                                                                                  
        if (t.amount != null) p.total += Math.abs(t.amount);                                                                                                        
        p.txns.push(t);                                                                                                                                             
      });                                                                                                                                                           
      pairs.forEach((p, key) => {                                                                                                                                   
        let color = STATE.edgeColor;                                                                                                                                
        if (STATE.useDirectionColors && STATE.mainEntity) {                                                                                                         
          if (p.to === STATE.mainEntity) color = STATE.inColor;                                                                                                     
          else if (p.from === STATE.mainEntity) color = STATE.outColor;                                                                                             
        }                                                                                                                                                           
        edges.push({                                                                                                                                                
          data: {                                                                                                                                                   
            id: `s_${key}`, source: p.from, target: p.to,                                                                                                           
            label: `${formatAmount(p.total)} (${p.count})`,                                                                                                         
            amount: p.total, count: p.count,                                                                                                                        
            thickness: STATE.edgeThicknessScale ? 2 : STATE.uniformEdgeWidth,                                                                                       
            color, arrowScale: arrowScale, txns: p.txns                                                                                                             
          }                                                                                                                                                         
        });                                                                                                                                                         
      });                                                                                                                                                           
    }                                                                                                                                                               
                                                                                                                                                                    
    // Scale node sizes from filtered transactions                                                                                                                  
    if (STATE.nodeSize === 'scaled') {                                                                                                                              
      const nodeVols = new Map();                                                                                                                                   
      txns.forEach(t => {                                                                                                                                           
        const amt = Math.abs(t.amount || 0);                                                                                                                        
        nodeVols.set(t.from, (nodeVols.get(t.from) || 0) + amt);                                                                                                    
        nodeVols.set(t.to, (nodeVols.get(t.to) || 0) + amt);                                                                                                        
      });                                                                                                                                                           
      const volValues = Array.from(nodeVols.values());                                                                                                              
      const logMin = Math.log1p(Math.min(...volValues));                                                                                                            
      const logMax = Math.log1p(Math.max(...volValues));                                                                                                            
      nodes.forEach((node, ent) => {                                                                                                                                
        const vol = nodeVols.get(ent) || 0;                                                                                                                         
        const t = logMax > logMin ? (Math.log1p(vol) - logMin) / (logMax - logMin) : 0.5;                                                                           
        node.data.size = 25 + t * 55;                                                                                                                               
      });                                                                                                                                                           
    }                                                                                                                                                               
                                                                                                                                                                    
    // Scale edge thickness from filtered transactions                                                                                                              
    if (STATE.edgeThicknessScale && edges.length > 0) {                                                                                                           
      const edgeAmts = edges.map(e => Math.abs(e.data.amount || 0));                                                                                                
      const logMin = Math.log1p(Math.min(...edgeAmts));                                                                                                             
      const logMax = Math.log1p(Math.max(...edgeAmts));                                                                                                             
      edges.forEach(e => {                                                                                                                                          
        const amt = Math.abs(e.data.amount || 0);                                                                                                                   
        const t = logMax > logMin ? (Math.log1p(amt) - logMin) / (logMax - logMin) : 0.5;                                                                           
        e.data.thickness = 1 + t * 8;                                                                                                                               
      });                                                                                                                                                           
    }                                                                                                                                                               
                                                                                                                                                                    
return applyGroupsToElements(Array.from(nodes.values()), edges);
  }
